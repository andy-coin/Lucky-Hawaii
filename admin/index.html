<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好韻器 回報後台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root {
  /* 配色對齊主程式 light theme */
  --bg-grad-1: #0c4564;
  --bg-grad-2: #001e3b;
  --header-grad-1: #b8865d;
  --header-grad-2: #8d51c9;
  --container-bg: #eee3ce;
  --card-bg: #f7fafc;
  --text-primary: #2d3748;
  --text-secondary: #6b778a;
  --text-muted: #94a0b8;
  --border: #d8cdb6;
  --shadow: 0 1px 4px rgba(0,0,0,.12);
  --section-label: #6b778a;
  --section-badge-bg: rgba(45,55,72,.08);
  --input-bg: rgba(255,255,255,.15);
  --input-border: rgba(255,255,255,.3);
  --action-preview-bg: rgba(45,55,72,.05);
  --action-preview-border: rgba(45,55,72,.1);
  /* Phase 7：行動色與文字色（亮暗各一份，皆 ≥ 4.5:1） */
  --action-bg: #5a67d8;
  --action-bg-hover: #4c51bf;
  --info-text: #4c51bf;
  --ok-text: #276749;
  --err-text: #9b2c2c;
  --warn-text: #92400e;
}

[data-theme="dark"] {
  --bg-grad-1: #1a202c;
  --bg-grad-2: #2d3748;
  --header-grad-1: #1a1f28;
  --header-grad-2: #174aa4;
  --container-bg: #2a313c;
  --card-bg: #1f2530;
  --text-primary: #e6e9ef;
  --text-secondary: #a0aec0;
  --text-muted: #6b778a;
  --border: #3a4453;
  --shadow: 0 1px 4px rgba(0,0,0,.5);
  --section-label: #a0aec0;
  --section-badge-bg: rgba(255,255,255,.08);
  --action-preview-bg: rgba(255,255,255,.04);
  --action-preview-border: rgba(255,255,255,.08);
  --action-bg: #5a67d8;
  --action-bg-hover: #4c51bf;
  --info-text: #a3bffa;
  --ok-text: #68d391;
  --err-text: #fc8181;
  --warn-text: #f6ad55;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
  color: var(--text-primary); min-height: 100vh;
  transition: background .3s ease;
}

/* ── Top bar ── */
.topbar {
  background: linear-gradient(150deg, var(--header-grad-1) 5%, var(--header-grad-2) 100%);
  color: #fff; padding: 14px 24px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.topbar h1 { font-size: 1.1rem; font-weight: 700; }
.topbar-stats { font-size: 0.82rem; opacity: .85; flex: 1; }
.topbar input.key-input {
  background: var(--input-bg); color: #fff; border: 1px solid var(--input-border);
  border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; width: 160px;
}
.topbar input.key-input::placeholder { color: rgba(255,255,255,.6); }
.topbar label.toggle {
  font-size: 0.82rem; display: flex; align-items: center; gap: 6px; cursor: pointer;
}
.btn {
  padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.85rem; font-weight: 600; transition: opacity .15s, background .15s;
}
.btn:hover { opacity: .85; }
.btn-reload { background: rgba(255,255,255,.22); color: #fff; }
.btn-theme  { background: rgba(255,255,255,.18); color: #fff; padding: 6px 10px; }

/* ── Layout ── */
.main {
  max-width: 960px; margin: 0 auto; padding: 24px 16px;
  display: flex; flex-direction: column; gap: 24px;
}

/* ── Section ── */
.section-title {
  font-size: 0.78rem; font-weight: 700; letter-spacing: .08em;
  color: var(--section-label); text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
  text-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.section-badge {
  background: var(--section-badge-bg); color: var(--text-secondary);
  border-radius: 20px; padding: 1px 8px; font-size: 0.72rem;
}

/* ── Report card ── */
.card {
  background: var(--container-bg); color: var(--text-primary);
  border-radius: 12px; padding: 16px 18px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--border);
  transition: opacity .2s;
  margin-bottom: 8px;
}
.card.agreed   { border-left-color: #48bb78; opacity: .85; }
.card.dismissed{ border-left-color: var(--border); opacity: .6; }
.card.archived { border-left-color: #94a3b8; opacity: .55; }
.card.manual   { border-left-color: #ed8936; }

.card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.card-type-badge {
  font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  background: rgba(102,126,234,.18); color: #667eea;
}
.card-type-badge.word  { background: rgba(217,119,6,.18); color: #d97706; }
.card-type-badge.reading { background: rgba(124,58,237,.18); color: #7c3aed; }
.card-type-badge.feedback { background: rgba(2,132,199,.18); color: #0284c7; }
.card-time { font-size: 0.72rem; color: var(--text-muted); margin-left: auto; }

.card-body { font-size: 0.95rem; line-height: 1.6; }
.card-char  { font-size: 1.4rem; font-weight: 700; color: #5a35b0; }
.card-reading { font-size: 1.1rem; color: #667eea; font-family: 'JetBrains Mono', monospace; margin-left: 4px; }
.card-word  { font-size: 1.1rem; font-weight: 700; color: #d97706; }
.card-reason{ display: inline-block; margin-top: 4px; padding: 2px 10px;
              border-radius: 20px; font-size: 0.78rem; font-weight: 600;
              background: var(--section-badge-bg); color: var(--text-secondary); }
.card-text  { font-size: 0.88rem; color: var(--text-secondary); margin-top: 6px; white-space: pre-wrap; }

/* ── Action row ── */
.card-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.action-preview {
  font-size: 0.75rem; color: var(--text-secondary); background: var(--action-preview-bg);
  border: 1px solid var(--action-preview-border); border-radius: 6px; padding: 3px 10px; flex: 1;
}
.action-preview.agreed   { color: #2f855a; border-color: rgba(72,187,120,.4); background: rgba(72,187,120,.12); }
.action-preview.dismissed{ color: var(--text-muted); }
.action-preview.archived { color: #94a3b8; border-color: rgba(148,163,184,.3); background: rgba(148,163,184,.08); }

.btn-agree    { background: #48bb78; color: #fff; padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-dismiss  { background: var(--section-badge-bg); color: var(--text-secondary); padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; }
.btn-archive  { background: rgba(148,163,184,.2); color: var(--text-secondary); padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; }
.btn-undo     { background: rgba(237,137,54,.18); color: #ed8936; padding: 5px 10px; border-radius: 8px; font-size: 0.78rem; }
.btn-agree:hover    { background: #38a169; }
.btn[disabled] { opacity: .5; cursor: wait; }

/* ── Missing reading modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--container-bg); color: var(--text-primary);
  border-radius: 16px; padding: 28px 32px;
  width: 420px; max-width: 95vw;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
}
.modal h3 { font-size: 1rem; margin-bottom: 16px; }
.modal label { font-size: 0.82rem; color: var(--text-secondary); display: block; margin-bottom: 4px; }
.modal input, .modal textarea, .modal select {
  width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 0.9rem; margin-bottom: 14px;
  font-family: inherit; background: var(--card-bg); color: var(--text-primary);
}
.modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: #667eea; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ── Empty state ── */
.empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.9rem; }
.empty.error { color: #fc8181; }
.empty .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 8px; opacity: .8; }

/* ── 多選 ── */
.card[data-group] { cursor: default; user-select: none; }
.card[data-group] *::selection { background: transparent; }
.card.selected {
  outline: 2px solid #d4a017;
  outline-offset: 0;
  background: rgba(250,204,21,.13);
}
[data-theme="dark"] .card.selected { background: rgba(250,204,21,.18); }

.marquee-box {
  position: fixed; display: none; z-index: 900;
  border: 1.5px dashed rgba(255,255,255,.7);
  background: rgba(255,255,255,.06);
  pointer-events: none;
}

.batch-bar {
  position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
  background: var(--container-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 18px; display: none; flex-direction: column; align-items: stretch; gap: 10px;
  box-shadow: 0 4px 28px rgba(0,0,0,.35);
  z-index: 950; font-size: 0.92rem; min-width: 130px;
}
.batch-bar.show { display: flex; }
.batch-bar .count { font-weight: 700; color: #d4a017; text-align: center; margin-bottom: 2px; }
.batch-bar .btn { font-size: 0.86rem; padding: 8px 14px; text-align: center; }
.batch-bar .btn-clear { background: var(--section-badge-bg); color: var(--text-secondary); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>🔍 好韻器 回報後台</h1>
  <span class="topbar-stats" id="statsLabel">尚未載入</span>
  <input type="password" class="key-input" id="keyInput" placeholder="USER_REPORT_KEY">
  <label class="toggle"><input type="checkbox" id="showArchived"> 顯示已封存 (<span id="archivedCount">0</span>)</label>
  <button class="btn btn-theme" onclick="toggleTheme()" title="切換亮/暗">🌓</button>
  <button class="btn btn-reload" id="reloadBtn" onclick="reload()">🔄 重新載入</button>
</div>

<!-- 批次工具列 + 橡皮筋框 -->
<div class="batch-bar" id="batchBar">
  <span>已選 <span class="count" id="batchCount">0</span> 列</span>
  <button class="btn btn-approve" id="batchApprove" onclick="batchApprove()">核准</button>
  <button class="btn btn-dismiss" id="batchDismiss" onclick="batchDismiss()">駁回</button>
  <button class="btn btn-archive" onclick="batchArchive()">📦 封存</button>
  <button class="btn btn-undo" onclick="batchRestore()">↩ 還原</button>
  <button class="btn btn-delete" onclick="batchDelete()">🗑 永久刪除</button>
  <button class="btn btn-clear" onclick="clearSelection()">清除選取</button>
</div>
<div class="batch-result" id="batchResult" role="status" aria-live="polite" hidden></div>
<div class="marquee-box" id="marqueeBox"></div>

<!-- Main -->
<div class="main" id="main">
  <div class="empty">輸入 USER_REPORT_KEY 後按「重新載入」</div>
</div>

<style>
/* edit panel & action buttons 補強 */
.edit-panel { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.edit-panel input { flex: 1; min-width: 180px; padding: 6px 10px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text-primary);
  font-family: inherit; font-size: 0.9rem; }
.edit-panel input:focus { outline: none; border-color: #667eea; }
.edit-panel select { padding: 6px 10px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--card-bg); color: var(--text-primary);
  font-family: inherit; font-size: 0.9rem; margin-right: 6px; }
.edit-panel select:focus { outline: none; border-color: #667eea; }
.btn-hide   { background: rgba(102,126,234,.18); color: #5b6cd1; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-remove { background: rgba(229,62,62,.18); color: #c53030; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-fix    { background: rgba(237,137,54,.18); color: #c05621; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-add    { background: #48bb78; color: #fff; padding: 5px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-note   { background: rgba(124,58,237,.18); color: #7c3aed; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.btn-delete { background: rgba(229,62,62,.22); color: #c53030; padding: 5px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; }
.action-preview.note { color: #7c3aed; border-color: rgba(124,58,237,.3); background: rgba(124,58,237,.08); }
.modify-arrow { color: var(--text-muted); margin: 0 6px; }

/* ── Phase 7：合併列、展開原文、核准按鈕（新規則只用 0.75 / 0.875 / 1.125 / 1.5rem 與 400 / 700）── */
.card-text { color: var(--text-primary); overflow-wrap: anywhere; }
.card-text.no-note { font-style: italic; }   /* 顏色不再用 --text-muted（亮色底只有 1.8:1），改用斜體區分 */
.card-word, .card-char, .card-reading, .card-subject, .card-reason { overflow-wrap: anywhere; min-width: 0; }
.card-word { font-size: 1.125rem; }
.card-char { font-size: 1.5rem; }
.card-reading { font-size: 1.125rem; }
.card-subject { font-size: 0.875rem; font-weight: 700; }
.card.live { border-left-color: var(--action-bg); opacity: 1; }
.action-preview.live { color: var(--info-text); border-color: rgba(90,103,216,.4); background: rgba(90,103,216,.08); }   /* .12 的亮色對比只有 4.44，降到 .08 */
.count-pill {
  display: inline-block; flex-shrink: 0; white-space: nowrap;
  padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
  background: var(--section-badge-bg); color: var(--text-primary);
}
.count-pill.many { background: rgba(217,119,6,.18); color: var(--warn-text); }
.row-check-wrap { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.row-check { width: 20px; height: 20px; accent-color: var(--action-bg); cursor: pointer; }
.row-toggle {
  display: inline-flex; align-items: center; background: none; border: none; cursor: pointer;
  padding: 4px 0; margin-top: 4px; font-family: inherit; font-size: 0.75rem; font-weight: 700;
  color: var(--text-primary);
}
.row-originals { margin-top: 8px; padding: 8px 12px; background: var(--section-badge-bg); border-radius: 8px; }
.row-originals[hidden] { display: none; }
.row-originals.scroll { max-height: 20rem; overflow-y: auto; }
.orig { padding: 8px 0; border-bottom: 1px solid var(--border); }
.orig:last-child { border-bottom: none; }
.orig-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.orig .card-time { margin-left: 0; font-size: 0.75rem; }
.mini-badge {
  padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
  background: var(--section-badge-bg); color: var(--text-primary);
}
.btn-approve { background: #2f855a; color: #fff; padding: 5px 14px; border-radius: 8px; font-size: 0.875rem; font-weight: 700; }
.btn-approve:hover { background: #276749; }
.manual-note { font-size: 0.75rem; font-weight: 700; color: var(--text-primary); padding: 4px 8px; }
.row-error { margin-top: 8px; font-size: 0.75rem; color: var(--err-text); overflow-wrap: anywhere; }
.notice { font-size: 0.875rem; padding: 8px 12px; border-radius: 8px; overflow-wrap: anywhere; }
.notice.warn {
  color: var(--warn-text); border-left: 4px solid #d97706;
  background: linear-gradient(rgba(217,119,6,.12), rgba(217,119,6,.12)), var(--container-bg);
}
.ai-z-label { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
.ai-z-warn { font-size: 0.75rem; color: var(--warn-text); }
.edit-panel input.warn-input { border-color: #ed8936; }
.locked .card, .locked .row-check-wrap, .locked .select-all { pointer-events: none; }
.batch-bar.busy { pointer-events: none; }
.batch-bar .btn-approve { font-size: 0.875rem; }
.batch-result {
  position: fixed; right: 20px; bottom: 20px; z-index: 960; max-width: 360px;
  background: var(--container-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  padding: 8px 12px; font-size: 0.75rem; font-weight: 700; overflow-wrap: anywhere;
}
.batch-result[hidden] { display: none; }
/* ── 套用列（黏在最上面）── */
.apply-bar {
  position: sticky; top: 0; z-index: 940;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  background: var(--container-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow);
}
.apply-text { flex: 1 1 240px; min-width: 0; }
.apply-summary { font-size: 0.875rem; font-weight: 400; }
.apply-summary b { font-weight: 700; }
.apply-note { font-size: 0.75rem; font-weight: 400; }
.btn-apply { margin-left: auto; background: var(--action-bg); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 700; }
.btn-apply:hover:not(:disabled) { background: var(--action-bg-hover); opacity: 1; }
.apply-line { flex-basis: 100%; font-size: 0.875rem; padding: 8px 12px; border-radius: 8px; overflow-wrap: anywhere; }
.apply-line.ok { color: var(--ok-text); background: rgba(72,187,120,.12); }
.apply-line.err { color: var(--err-text); background: rgba(229,62,62,.12); }
.apply-line.warn { color: var(--warn-text); background: rgba(217,119,6,.12); }
.apply-line.neutral { color: var(--text-primary); background: var(--section-badge-bg); }
.apply-retry { background: none; color: var(--info-text); padding: 4px 8px; font-size: 0.875rem; font-weight: 700; text-decoration: underline; }
.live-badge { padding: 4px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; background: rgba(90,103,216,.08); color: var(--info-text); }   /* UI-SPEC 寫 .18，亮色底只有 4.1:1，降到 .08 才過 4.5 */
.btn-undo.btn-revoke { color: var(--warn-text); font-size: 0.875rem; font-weight: 700; }
/* ── 篩選列 ── */
.filter-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--container-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow);
}
.select-all { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; cursor: pointer; margin-right: auto; }
.select-all input { width: 20px; height: 20px; accent-color: var(--action-bg); cursor: pointer; }
.filter-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
  background: var(--section-badge-bg); color: var(--text-primary);
}
.chip.active { background: var(--action-bg); color: #fff; }

/* ── 手機（≤ 700px）：新控制項至少 44px 高、列會換行、批次列貼底（D-18）── */
@media (max-width: 700px) {
  .topbar { padding: 12px 16px; }
  .topbar-stats { flex-basis: 100%; }
  .topbar input.key-input { min-height: 44px; width: 100%; }
  .topbar label.toggle { min-height: 44px; }
  .btn, .chip { min-height: 44px; }
  .btn-theme { min-width: 44px; }
  .main { padding-bottom: 24px; }
  body:has(.batch-bar.show) .main { padding-bottom: 200px; }
  .filter-row { padding: 12px; }
  .apply-bar { padding: 12px; }
  .apply-text { flex-basis: 100%; }
  .btn-apply { flex: 1 1 100%; margin-left: 0; }
  .select-all { min-height: 44px; flex-basis: 100%; }
  .card-header { gap: 8px; }
  .card-header .card-time { flex-basis: 100%; margin-left: 0; }
  .row-check-wrap { min-width: 44px; min-height: 44px; }
  .row-toggle { min-height: 44px; min-width: 44px; }
  .card-actions { gap: 8px; }
  .card-actions .action-preview { flex-basis: 100%; }
  .edit-panel input, .edit-panel select { min-height: 44px; }
  .batch-bar {
    left: 0; right: 0; top: auto; bottom: 0; transform: none; min-width: 0;
    flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    border-radius: 14px 14px 0 0; padding: 8px 12px;
  }
  .batch-bar > span { flex-basis: 100%; text-align: center; }
  .batch-result { left: 8px; right: 8px; top: 8px; bottom: auto; max-width: none; }
}
</style>

<!-- 通用「人工新增」modal（缺字 / 缺少讀音）-->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3 id="addModalTitle">➕ 新增</h3>
    <label id="addModalSubjectLabel">主體</label>
    <input id="addSubject">
    <label id="addModalContentLabel">內容</label>
    <input id="addContent" placeholder="">
    <label>分級</label>

// rhyme-dict.js 暴露 var _rhymeDictData = {'<注音+聲調>': '常用｜一般｜冷僻', ...}
const CHAR_READINGS = (() => {
  const m = new Map();
  if (typeof _rhymeDictData !== 'object' || !_rhymeDictData) return m;
  for (const [key, val] of Object.entries(_rhymeDictData)) {
    for (const ch of String(val).replace(/[｜\-]/g, '')) {
      if (!m.has(ch)) m.set(ch, []);
      m.get(ch).push(key);  // 例：'ㄔㄣˊ'
    }
  }
  return m;
})();
// 輸入「晨曦微亮」→ 「ㄔㄣˊ ㄒㄧ ㄨㄟˊ ㄌㄧㄤˋ」；缺字以「?」佔位；破音字取第一個讀音
function lookupWordZhuyin(word) {
  if (!word) return '';
  return Array.from(word).map(ch => {
    const arr = CHAR_READINGS.get(ch);
    return arr && arr.length ? arr[0] : '?';
  }).join(' ');
}

// ── Effective readings (original + overrides applied) ──
let _rhymeOvr = null;
async function _loadRhymeOvr() {
  if (_rhymeOvr) return;
  try {
    const res = await fetch('../data/rhyme-dict-overrides.json');
    _rhymeOvr = res.ok ? await res.json() : {};
  } catch(e) { _rhymeOvr = {}; }
}
// 有效讀音 = 字庫 → data 裡的修正檔 → 線上修正層的 view（E6），這樣取代讀音時看到的是連鎖修正後的結果
function getEffectiveReadings(char) {
  const keys = [...(CHAR_READINGS.get(char) || [])];
  if (_rhymeOvr) applyReadingOvr(keys, char, _rhymeOvr);
  const lv = layer.view && layer.view.rhymeDict;
  if (lv) applyReadingOvr(keys, char, lv);
  return keys;
}
function applyReadingOvr(keys, char, ovr) {
  for (const r of ovr.removed || [])
    if (r.char === char) { const i = keys.indexOf(r.dict_key); if (i >= 0) keys.splice(i, 1); }
  for (const r of ovr.hidden || [])
    if (r.char === char) { const i = keys.indexOf(r.dict_key); if (i >= 0) keys.splice(i, 1); }
  for (const r of ovr.fixed || [])
    if (r.char === char) { const i = keys.indexOf(r.from); if (i >= 0) keys[i] = r.to; }
  for (const r of ovr.added || [])
    if (r.char === char && !keys.includes(r.dict_key)) keys.push(r.dict_key);
}

const TONE_DIGIT_MARK = { '1':'', '2':'ˊ', '3':'ˇ', '4':'ˋ', '5':'˙', '0':'˙' };

// 把單一音節「正規化」成「注音 + 聲調符號」（無聲調=一聲）
function normalizeSyllable(tok) {
  if (!tok) return '';
  // 1) 切出聲調：尾端可能是 ˊˇˋ˙ 或 1-5 數字
  let body = tok, tone = '';
  const tailMark = tok.slice(-1);
  if ('ˊˇˋ˙'.includes(tailMark)) { body = tok.slice(0, -1); tone = tailMark; }
  else if (/[0-5]$/.test(tok)) { body = tok.slice(0, -1); tone = TONE_DIGIT_MARK[tok.slice(-1)] || ''; }
  // 2) body 若全是注音字 → 直接用
  if (/^[ㄅ-ㄩ]+$/.test(body)) return body + tone;
  // 3) body 若是拼音 → 查表
  const py = body.toLowerCase().replace(/v/g, 'ü').replace(/u:/g, 'ü');
  if (_py2zy[py]) return _py2zy[py] + tone;
  // 4) 處理 ju/qu/xu/yu 系列（拼音 u 實為 ü 的情形已內建表）
  return tok;  // 認不出，原樣回，讓 validator 抓
}

// 把使用者輸入的整串讀音正規化（合併空白、把 - / · 等視為分隔符）
function normalizeReading(raw) {
  if (raw == null) return '';
  let s = String(raw).trim();
  s = s.replace(/[\-\/·、,，‧]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  return s.split(' ').map(normalizeSyllable).filter(Boolean).join(' ');
}

// 檢查是否為合法注音串（每音節：注音字 + 可選聲調符號），可指定音節數
function isValidZhuyin(s, expected) {
  if (!s) return false;
  const parts = s.split(' ');
  if (expected != null && parts.length !== expected) return false;
  return parts.every(p => /^[ㄅ-ㄩ]+[ˊˇˋ˙]?$/.test(p));
}

// ── Worker fetch：金鑰只放在 X-Admin-Key header，網址上不帶（B4）──
function adminFetch(path, opts = {}) {
  return fetch(WORKER_URL + path, { ...opts, headers: { 'X-Admin-Key': getKey(), ...(opts.headers || {}) } });
}

const MSG_KEY  = '金鑰不對或還沒填，請確認後再按「重新載入」';
const MSG_LOAD = '讀不到回報，請檢查網路後再按「重新載入」';
const MSG_ROW  = '這一列沒有存成功，請再試一次';

function setLoadError(msg, hint) {
  loadState = 'error'; loadError = { msg, hint: hint || '' };
  render();
}

async function fetchReports() {
  if (!getKey()) { setLoadError(MSG_KEY); return; }
  loadState = 'loading'; render();
  try {
    const res = await adminFetch('/reports.json');
    if (res.status === 401 || res.status === 403) { setLoadError(MSG_KEY); return; }
    if (!res.ok) { setLoadError(MSG_LOAD, `(${res.status})`); return; }
    const list = await res.json();
    if (!Array.isArray(list)) { setLoadError(MSG_LOAD, '(回應格式不對)'); return; }
    truncated = res.headers.get('X-Reports-Truncated') === '1';
    reports = list.filter(r => r && typeof r === 'object');
    reports.forEach((r, i) => {
      if (!r.kvKey) r.kvKey = `__no_key_${i}`;
      normalizeAISuggest(r);
      // 顯示前正規化使用者輸入的讀音欄位（自由輸入 → 統一注音空格分隔）
      if (r.reading)   r.reading   = dispRead(r.reading);
      if (r.suggested) r.suggested = dispRead(r.suggested);
    });
    selectedGroups.clear(); _lastClickedKey = null; expanded.clear(); rowErrors.clear();
    if (_layerP) await _layerP;   // 修正層讀完再畫，列的「已上線」才不會先顯示成「已核准」又跳掉
    loadState = 'ok'; loadError = null;
    render();
  } catch(e) {
    setLoadError(MSG_LOAD, `(${e.message})`);
  }
}

// 樂觀更新：先改本地 state，背景送 worker；失敗就回滾並回 false（錯誤文字由呼叫端顯示在那一列）
async function postDecision(kvKey, status, action) {
  const r = reports.find(x => x.kvKey === kvKey);
  if (!r) return false;
  const prev = { status: r.status, decided_at: r.decided_at, action: r.action };
  const rollback = () => {
    if (prev.status === undefined) { delete r.status; delete r.decided_at; delete r.action; }
    else { r.status = prev.status; r.decided_at = prev.decided_at; if (prev.action) r.action = prev.action; else delete r.action; }
  };
  if (status === 'pending') { delete r.status; delete r.decided_at; delete r.action; }
  else {
    r.status = status;
    r.decided_at = new Date().toISOString();
    if (action) r.action = action; else delete r.action;
  }
  try {
    const res = await adminFetch('/reports/decision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kvKey, status, action })
    });
    if (!res.ok) { rollback(); return false; }
    return true;
  } catch(e) {
    rollback();
    return false;
  }
}

// 最多 n 個同時進行
async function pool(items, n, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k]); }
  }));
  return out;
}

// ── 線上修正層（FB-03／FB-04）：套用、撤回、讀取 ──
const MSG_409 = '線上修正層剛剛有變動，請按「重新載入」後再';
const pendingKeys = () => reports.filter(r => memberStatus(r) === 'approved').map(r => r.kvKey);
const groupEntries = g => [...new Set(g.members.map(m => layer.byKey.get(m.kvKey)).filter(Boolean))];
const jsonPost = body => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function setLayer(d) {
  const written = Array.isArray(d.written) ? d.written : [];
  const byKey = new Map();
  for (const e of d.entries) for (const k of e.source_kvKeys || []) byKey.set(k, e);
  layer = { rev: d.rev, entries: d.entries, written, view: d.view || null, state: 'ok', byKey, writtenSet: new Set(written) };
}
// 讀整份修正層；quiet = 呼叫端自己會重畫。失敗不丟錯，只把狀態改成 error（套用因此停用）
async function loadLayer(quiet) {
  try {
    if (!getKey()) throw new Error('no key');
    const res = await adminFetch('/corrections/admin.json');
    if (!res.ok) throw new Error(String(res.status));
    const d = await res.json();
    if (!d || !Array.isArray(d.entries)) throw new Error('shape');
    setLayer(d);
  } catch (e) { layer.state = 'error'; }
  if (!quiet && loadState === 'ok') render();
}

function retryLayer() { layer.state = 'loading'; render(); loadLayer(); }
const failReason = status => status === 401 || status === 403 ? '金鑰不對' : `伺服器回應 ${status}`;
const applyFail = reason => ({ kind: 'err', text: `套用沒有成功：${reason}。已核准的內容都還在，可以直接再按一次。` });

// 🚀 套用到線上：只送 kvKey 和目前的 rev（內容由 Worker 自己從回報讀），每 100 筆一批，沒有確認視窗（可以撤回）
async function applyApproved() {
  if (layerBusy || batchBusy || layer.state !== 'ok') return;
  const keys = pendingKeys();
  if (!keys.length) return;
  layerBusy = applying = batchBusy = true; applyMsg = null;
  const rows = _groups.filter(g => g.st.counts.approved).map(g => g.key);
  rows.forEach(k => { busyGroups.add(k); rowErrors.delete(k); });
  render();
  let msg = null, any = false, skipped = 0;
  try {
    for (let i = 0; i < keys.length; i += 100) {
      const res = await adminFetch('/corrections/apply', jsonPost({ kvKeys: keys.slice(i, i + 100), baseRev: layer.rev }));
      if (res.status === 409) { msg = { kind: 'err', text: MSG_409 + '套用' }; break; }
      if (!res.ok) { msg = applyFail(failReason(res.status)); break; }
      const d = await res.json();
      layer.rev = d.rev; any = true;
      // 重複的（已套用／已寫入）不算沒套用；其餘是 Worker 重驗後不收的，仍留在等待套用
      skipped += (d.skipped || []).filter(x => !['already_applied', 'already_written'].includes(x.reason)).length;
    }
  } catch (e) { msg = applyFail('網路不通'); }
  if (any) await loadLayer(true);
  layerBusy = applying = batchBusy = false;
  rows.forEach(k => busyGroups.delete(k));
  const done = keys.length - skipped;
  applyMsg = msg || (done
    ? { kind: 'ok', text: `已套用 ${done} 筆。約 1～2 分鐘內生效，網站重新整理就會看到。` + (skipped ? `另有 ${skipped} 筆沒有套用（內容不符規則），仍留在等待套用。` : '') }
    : applyFail(`${skipped} 筆的內容都不符規則，沒有一筆被套用`));
  render();
}

// 撤回：依來源回報找出這一列在修正層裡的項目，一次送出；成功後回到「已核准、未套用」
async function revokeGroup(groupKey) {
  const g = findGroup(groupKey);
  if (!g || layerBusy || batchBusy) return;
  const ids = groupEntries(g).map(e => e.id);
  if (!ids.length) return;
  layerBusy = true; applyMsg = null; busyGroups.add(groupKey); rowErrors.delete(groupKey); render();
  let msg;
  try {
    const res = await adminFetch('/corrections/revoke', jsonPost({ ids, baseRev: layer.rev }));
    if (res.ok) { await loadLayer(true); msg = { kind: 'neutral', text: `已撤回「${subjectLabel(g)}」，約 1～2 分鐘內從線上移除` }; }
    else if (res.status === 404) msg = { kind: 'err', text: '這筆修正已不在線上（可能已撤回或已寫入資料檔），請重新載入' };
    else if (res.status === 409) msg = { kind: 'err', text: MSG_409 + '試' };
    else msg = { kind: 'err', text: `撤回沒有成功：${failReason(res.status)}。可以再按一次。` };
  } catch (e) { msg = { kind: 'err', text: '撤回沒有成功：網路不通。可以再按一次。' }; }
  layerBusy = false; busyGroups.delete(groupKey);
  applyMsg = msg; render();
}

// ── 分組（B1、D-11）：同一個詞（或字＋讀音）＋同一個回報類型合成一列；feedback 與 AI 建議各自一列 ──
const MERGED_TYPES = ['word-report', 'char-reading-report'];
const KNOWN_TYPES = ['ai-word-suggest', 'char-reading-report', 'word-report', 'feedback'];
const tsNum = r => { const t = Date.parse(r.ts); return isNaN(t) ? 0 : t; };

// 字串完全相等才算同一組，不做任何正規化
function groupKeyOf(r) {
  if (r.type === 'word-report') return `w\u0001${r.word ?? ''}\u0001${r.reportType ?? ''}`;
  if (r.type === 'char-reading-report') return `c\u0001${r.char ?? ''}\u0001${r.reading ?? ''}\u0001${r.reportType ?? ''}`;
  return `k\u0001${r.kvKey}`;
}

function groupReports(list) {
  const map = new Map();
  for (const r of list) {
    if (!KNOWN_TYPES.includes(r.type)) continue;
    const key = groupKeyOf(r);
    if (!map.has(key)) map.set(key, { key, type: r.type, members: [] });
    map.get(key).members.push(r);
  }
  const out = [...map.values()];
  for (const g of out) {
    // 列內最新的在前
    g.members.sort((a, b) => tsNum(b) - tsNum(a) || (a.kvKey < b.kvKey ? 1 : a.kvKey > b.kvKey ? -1 : 0));
    const rep = g.members[0];
    g.reportType = rep.reportType || '';
    g.subject = g.type === 'word-report' ? String(rep.word ?? '')
              : g.type === 'char-reading-report' ? String(rep.char ?? '') + String(rep.reading ?? '')
              : String(rep.subject || rep.word || '');
    g.latest = rep.ts; g.latestNum = tsNum(rep);
    g.earliest = g.members[g.members.length - 1].ts;
  }
  return out;
}

const STATUS_NAME = { pending: '待審', approved: '已核准', live: '已上線', written: '已寫入', done: '已處理', dismissed: '已駁回', archived: '已封存' };
// 待審 > 已核准未套用 > 已上線 > 已駁回 > 已封存
const STATUS_RANK = { pending: 0, approved: 1, live: 2, written: 3, done: 4, dismissed: 5, archived: 6 };

// 已上線／已寫入由修正層推出來（C2），不另外寫進回報：byKey 對得到 = 在線上，writtenSet 對得到 = 已寫進資料檔
function memberStatus(r, lay = layer) {
  const s = r.status || 'pending';
  if (s === 'agreed') {
    if (lay.byKey && lay.byKey.has(r.kvKey)) return 'live';
    if (lay.writtenSet && lay.writtenSet.has(r.kvKey)) return 'written';
    if (r.action && r.action.type === 'note') return 'done';
    return 'approved';
  }
  return s === 'dismissed' || s === 'archived' ? s : 'pending';
}
function groupStatus(g) {
  const counts = {};
  for (const m of g.members) { const s = memberStatus(m); counts[s] = (counts[s] || 0) + 1; }
  const present = Object.keys(counts).sort((a, b) => STATUS_RANK[a] - STATUS_RANK[b]);
  return { status: present[0], counts, present };
}
// 篩選用的分類：已寫入資料檔歸「已上線」；已處理（備註）與已封存只在「全部」看得到
const BUCKET = { pending: 'pending', approved: 'approved', live: 'live', written: 'live', dismissed: 'dismissed' };
const FILTERS = [['all', '全部'], ['pending', '待審'], ['approved', '已核准未套用'], ['live', '已上線'], ['dismissed', '已駁回']];
// 待審在前，再依最新時間新到舊，同時間依主題字串由小到大（逐字元比較，結果固定）
function cmpGroups(a, b) {
  return (a.st.status === 'pending' ? 0 : 1) - (b.st.status === 'pending' ? 0 : 1)
      || b.latestNum - a.latestNum
      || (a.subject < b.subject ? -1 : a.subject > b.subject ? 1 : 0);
}
// 已上線或已寫入的回報不能再被核准／駁回／封存（要先撤回，07-07）
const isLocked = m => ['live', 'written'].includes(memberStatus(m));
const findGroup = key => _groupMap.get(key);

// D-12：太冷僻 → 隱藏、不該出現 → 移除；讀音錯誤、其他等沒有預設動作，要手動
const APPROVE_DEFAULT = {
  'word-report':         { '極度冷僻': 'hideWord',    '不該出現': 'removeWord' },
  'char-reading-report': { '極度冷僻': 'hideReading', '不該出現': 'removeReading' },
};
function approveOpFor(g) { return (APPROVE_DEFAULT[g.type] || {})[g.reportType] || null; }

// ── UI helpers ──
function setStats(text) { document.getElementById('statsLabel').textContent = text; }
function reload() { applyMsg = null; layer.state = 'loading'; _layerP = loadLayer(true); fetchReports(); }
document.getElementById('showArchived').addEventListener('change', render);
keyInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') reload(); });

// ── Rendering ──
function render() {
  const main = document.getElementById('main');
  main.dataset.state = loadState;
  main.classList.toggle('locked', batchBusy);
  document.getElementById('reloadBtn').disabled = loadState === 'loading';

  if (loadState !== 'ok') {
    _groups = []; _groupMap = new Map(); visibleKeys = [];
    selectedGroups.clear(); updateBatchBar();
    if (loadState === 'idle') {
      main.innerHTML = '<div class="empty">輸入 USER_REPORT_KEY 後按「重新載入」</div>';
      setStats('尚未載入');
    } else if (loadState === 'loading') {
      main.innerHTML = '<div class="empty">載入中…</div>';
      setStats('載入中…');
    } else {
      main.innerHTML = `<div class="empty error">${esc(loadError.msg)}${loadError.hint ? `<div class="hint">${esc(loadError.hint)}</div>` : ''}</div>`;
      setStats('—');
    }
    return;
  }

  _groups = groupReports(reports);
  _groupMap = new Map(_groups.map(g => [g.key, g]));
  _groups.forEach(g => { g.st = groupStatus(g); });

  const n = s => _groups.filter(g => g.st.status === s).length;
  setStats(`共 ${_groups.length} 組（${reports.length} 筆）· 待審 ${n('pending')} · 已核准未套用 ${n('approved')} · 已上線 ${n('live') + n('written')} · 已封存 ${n('archived')}`);
  document.getElementById('archivedCount').textContent = n('archived');

  // 顯示已封存疊在狀態篩選上面；全選與批次只動這裡算出來的 visible
  const showArchived = document.getElementById('showArchived').checked;
  const pool = _groups.filter(g => showArchived || g.st.status !== 'archived');
  const counts = { all: pool.length, pending: 0, approved: 0, live: 0, dismissed: 0 };
  pool.forEach(g => { const b = BUCKET[g.st.status]; if (b) counts[b]++; });
  const visible = pool.filter(g => filter === 'all' || BUCKET[g.st.status] === filter).sort(cmpGroups);
  visibleKeys = visible.map(g => g.key);

  let html = applyBarHtml();
  if (truncated) html += '<div class="notice warn">只載入最新 800 筆</div>';
  if (!_groups.length) {
    html += '<div class="empty">目前沒有回報。<div class="hint">有新的回報時會顯示在這裡；也可以按「重新載入」。</div></div>';
  } else {
    html += `<div class="filter-row">
      <label class="select-all"><input type="checkbox" id="selectAll" data-act="select-all"> 全選目前篩選結果（${visible.length} 列）</label>
      <div class="filter-chips" role="group" aria-label="狀態篩選">${FILTERS.map(([k, label]) =>
        `<button type="button" class="btn chip${filter === k ? ' active' : ''}" data-act="filter" data-filter="${k}" aria-pressed="${filter === k}">${label} (${counts[k]})</button>`).join('')}</div>
    </div>`;
    if (!visible.length) {
      html += '<div class="empty">這個篩選下沒有回報（改選「全部」看看）</div>';
    } else {
      const part = type => visible.filter(g => g.type === type);
      const ai = part('ai-word-suggest'), rd = part('char-reading-report'), wd = part('word-report'), fb = part('feedback');
      if (ai.length) html += section('🌟 AI 建議收錄', ai);
      if (rd.length) html += section('🔤 讀音回報', rd);
      if (wd.length) html += section('🃏 字卡回報', wd);
      if (fb.length) html += section('📬 一般回饋', fb);
    }
  }
  main.innerHTML = html;
  updateBatchBar();
}

// 黏在最上面的套用列：修正層筆數、等待套用幾筆、🚀 按鈕，以及最近一次套用／撤回的結果
function applyBarHtml() {
  const ok = layer.state === 'ok', m = pendingKeys().length;
  const n = layer.entries.length;
  const summary = ok ? `線上修正層：<b>${n}</b> 筆 · 等待套用：<b>${m}</b> 筆`
    : layer.state === 'error' ? '線上修正層：讀取失敗 <button type="button" class="btn apply-retry" data-act="layer-retry" aria-label="重新讀取線上修正層" title="重新讀取線上修正層">重試</button>'
    : '線上修正層：讀取中…';
  const note = ok ? (m ? '按下後約 1～2 分鐘內生效（網站重新整理就會看到）' : '沒有等待套用的核准項目') : '';
  // 提示行依序：讀不到 → 修正層太大（C6，只是提醒，不停用套用）→ 最近一次套用／撤回的結果
  const lines = [];
  if (layer.state === 'error') lines.push({ kind: 'err', text: '讀不到線上修正層，請檢查網路或金鑰後按「重試」' });
  if (ok && n > 500) lines.push({ kind: 'warn', text: `修正層已經有 ${n} 筆（超過 500 筆）。建議先跑寫回腳本 npm run corrections:writeback，把修正寫進 data。仍然可以繼續套用。` });
  if (applyMsg) lines.push(applyMsg);
  const line = lines.map(l => `<div class="apply-line ${l.kind}" role="${l.kind === 'err' ? 'alert' : 'status'}">${esc(l.text)}</div>`).join('');
  return `<div class="apply-bar" id="applyBar">
    <div class="apply-text"><div class="apply-summary">${summary}</div><div class="apply-note">${note}</div></div>
    <button type="button" class="btn btn-apply" id="applyBtn" data-act="apply"${ok && m && !layerBusy ? '' : ' disabled'}>${applying ? '套用中…' : `🚀 套用到線上（${m}）`}</button>
    ${line}
  </div>`;
}

function section(title, items) {
  const pending = items.filter(g => g.st.status === 'pending').length;
  return `<div>
      <div class="section-title">${title}<span class="section-badge">${items.length} 列 · 待審 ${pending}</span></div>
      ${items.map(renderGroupRow).join('')}
    </div>`;
}

// 本機時間，到分鐘：YYYY-MM-DD HH:mm
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return String(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── Action preview 文字 ──
function actionText(r) {
  const a = r && r.action;
  if (!a) return '';
  const fn = ACTION_LABEL[a.type];
  return fn ? fn(a) : a.type;
}
function previewForGroup(g) {
  const st = g.st;
  if (busyGroups.has(g.key)) return '處理中…';
  if (st.present.length > 1) return st.present.map(s => `${STATUS_NAME[s]} ${st.counts[s]}`).join(' · ');
  const rep = g.members[0];
  switch (st.status) {
    case 'approved': return `✓ ${actionText(rep)}（等待套用）`;
    case 'live': {
      const t = groupEntries(g).map(e => e.applied_at).filter(Boolean).sort().pop();
      return `🚀 已上線 · ${actionText(rep)}` + (t ? ` · 套用於 ${fmtTime(t)}` : '');
    }
    case 'written':  return '✓ 已寫入資料檔';
    case 'done':     return `✓ ${actionText(rep)}`;
    case 'dismissed':return '× 駁回';
    case 'archived': return '📦 已封存';
    default:         return '待審';
  }
}
const PREVIEW_CLASS = { pending: '', approved: 'agreed', live: 'live', written: 'agreed', done: 'agreed', dismissed: 'dismissed', archived: 'archived' };

// ── 通用 dispatch ──
// op: hide / remove / fix(需要 input) / dismiss / archive / undo / addModal(缺字、缺少讀音) / accept / modify / note
// 每個動作對列內「每一筆」各寫一次同樣的決定（B2），最多同時 4 筆
async function decideMembers(g, decide, conc) {
  const targets = g.members.filter(m => !isLocked(m));
  const res = await pool(targets, conc, async m => {
    const d = decide(m);
    return d ? postDecision(m.kvKey, d[0], d[1]) : false;
  });
  return res.every(Boolean);
}

async function runGroup(groupKey, decide) {
  const g = findGroup(groupKey);
  if (!g || busyGroups.has(groupKey) || batchBusy) return false;
  busyGroups.add(groupKey); rowErrors.delete(groupKey); applyMsg = null; render();
  const ok = await decideMembers(g, decide, 4);
  busyGroups.delete(groupKey);
  if (!ok) rowErrors.set(groupKey, MSG_ROW);
  render();
  return ok;
}

function decideFor(op, payload) {
  if (op === 'dismiss') return () => ['dismissed', null];
  if (op === 'archive') return () => ['archived', null];
  if (op === 'undo')    return () => ['pending', null];
  return m => { const a = buildAction(m, op, payload); return a ? ['agreed', a] : null; };
}
function execGroup(groupKey, op, payload) {
  if (op === 'delete') return deleteGroups([groupKey]);
  return runGroup(groupKey, decideFor(op, payload));
}
function approveGroup(groupKey) {
  const g = findGroup(groupKey);
  const op = g && approveOpFor(g);
  return op ? execGroup(groupKey, op) : false;
}

function buildAction(r, op, payload) {
  const reading = r.reading || '';
  const dict_key = readingToDictKey(reading);
  switch (op) {
    case 'hideReading':   return { type: 'hide_char_reading',   char: r.char, dict_key, reading, reason: r.reportType };
    case 'removeReading': return { type: 'remove_char_reading', char: r.char, dict_key, reading, reason: r.reportType };
    case 'fixReading':    return { type: 'fix_char_reading', char: r.char,
                                   old_reading: reading, old_dict_key: dict_key,
                                   new_reading: payload, new_dict_key: readingToDictKey(payload),
                                   reason: r.reportType };
    case 'replaceReading': {
      const { old_reading, new_reading } = payload || {};
      return { type: 'fix_char_reading', char: r.char,
               old_reading, old_dict_key: readingToDictKey(old_reading),
               new_reading, new_dict_key: readingToDictKey(new_reading),
               reason: r.reportType };
    }
    case 'hideWord':      return { type: 'hide_word',   word: r.word, reason: r.reportType };
    case 'removeWord':    return { type: 'remove_word', word: r.word, reason: r.reportType };
    case 'fixWord':       return { type: 'fix_word_reading', word: r.word, new_z: payload, reason: r.reportType };
    case 'acceptAI':      return { type: 'accept_ai_word', word: r.word, z: payload };
    case 'modifyAI':      return { type: 'modify_ai_word', original: r.word, modified: r.modified || r.word, z: payload };
    case 'note':          return { type: 'note', text: payload };
    default: return null;
  }
}

// ── 永久刪除 ──
async function deleteMembers(members) {
  if (!getKey()) { alert('密鑰遺失'); return; }
  const ids = new Set(members.map(m => m.kvKey));
  const removed = reports.filter(r => ids.has(r.kvKey));
  reports = reports.filter(r => !ids.has(r.kvKey));
  render();
  const results = await pool(removed, 4, async r => {
    try {
      const res = await adminFetch('/reports/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kvKey: r.kvKey })
      });
      return res.ok ? null : { r, t: await res.text(), status: res.status };
    } catch(e) { return { r, t: e.message, status: 0 }; }
  });
  const errs = results.filter(Boolean);
  if (errs.length) {
    reports.push(...errs.map(e => e.r)); render();
    alert(`${errs.length} 筆刪除失敗：\n` + errs.slice(0, 5).map(e => `${e.r.kvKey}: (${e.status}) ${e.t}`).join('\n'));
  }
}
function deleteGroups(keys) {
  const groups = keys.map(findGroup).filter(Boolean);
  const members = groups.flatMap(g => g.members.filter(m => !isLocked(m)));
  if (!members.length) return;
  const msg = groups.length === 1 && members.length === 1 ? '永久刪除這筆回報？此操作無法還原。'
            : `永久刪除 ${groups.length} 列（共 ${members.length} 筆）？此操作無法還原。`;
  if (!confirm(msg)) return;
  return deleteMembers(members);
}

// ── 編輯面板需要的預設值（從列的資料算，不放進 HTML 屬性）──
function editOpts(g, op) {
  const sugg = (g.members.find(m => m.suggested) || {}).suggested || '';
  if (op === 'fixReading') return { placeholder: '新注音(含聲調) 例：ㄏㄜˊ', defaultValue: sugg || g.members[0].reading || '' };
  if (op === 'fixWord')    return { placeholder: '每字注音空格分隔 例：ㄏㄠˇ ㄩㄣˋ', defaultValue: sugg };
  if (op === 'note')       return { placeholder: '寫一句備註（只存在這筆回報裡，不會改詞庫）' };
  return {};
}

// ── Edit panel（inline 輸入） ──
function openEdit(groupKey, op) {
  const g = findGroup(groupKey);
  if (!g) return;
  _editing = { groupKey, op, ...editOpts(g, op) };
  render(); setTimeout(()=>document.getElementById('editInput')?.focus(), 30);
}
function closeEdit() { _editing = null; render(); }
function confirmEdit() {
  const inp = document.getElementById('editInput');
  const raw = inp.value.trim();
  if (!raw) { alert('請輸入內容'); return; }
  const { groupKey, op } = _editing;
  // 讀音類動作要校驗
  const NEEDS_ZHUYIN = { fixReading: 1, fixWord: 'word', replaceReading: 1 };
  if (op in NEEDS_ZHUYIN) {
    const norm = normalizeReading(raw);
    let expected = NEEDS_ZHUYIN[op];
    if (expected === 'word') {
      const g = findGroup(groupKey);
      const r = g && g.members[0];
      expected = r && r.word ? Array.from(r.word).length : null;
    }
    if (!isValidZhuyin(norm, expected)) {
      alert(`格式錯誤：請用注音 + 空格分隔${expected? ('（需 ' + expected + ' 個音節）') : ''}\n例：ㄏㄠˇ ㄩㄣˋ\n你輸入的：${raw}\n推測為：${norm || '(無法解析)'}`);
      inp.value = norm || raw;
      inp.focus(); inp.select();
      return;
    }
    inp.value = norm;
    // replaceReading 需同時帶 old + new
    if (op === 'replaceReading') {
      const oldReading = document.getElementById('editSelect')?.value || '';
      _editing = null;
      execGroup(groupKey, op, { old_reading: oldReading, new_reading: norm });
      return;
    }
    _editing = null;
    execGroup(groupKey, op, norm);
    return;
  }
  _editing = null;
  execGroup(groupKey, op, raw);
}
function editPanelHTML() {
  const sel = _editing.selectOptions
    ? `<label style="font-size:0.85rem;margin-right:4px">${esc(_editing.selectLabel || '舊')}</label>
       <select id="editSelect">
         ${_editing.selectOptions.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}
       </select>
       <span style="margin-right:4px">→</span>`
    : '';
  return `<div class="edit-panel">
    ${sel}
    <input id="editInput" placeholder="${esc(_editing.placeholder || '')}" value="${esc(_editing.defaultValue || '')}"
      onkeydown="if(event.key==='Enter')confirmEdit();if(event.key==='Escape')closeEdit();">
    <button class="btn btn-agree" onclick="confirmEdit()">✓ 確認</button>
    <button class="btn btn-dismiss" onclick="closeEdit()">取消</button>
  </div>`;
}

// ── Add modal（缺字 / 缺少讀音 同意新增）──
function openAddModal(groupKey, op) {

function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
  _addModalCtx = null;
}
async function confirmAdd() {
  if (!_addModalCtx) return;
  const { groupKey, op } = _addModalCtx;
  const subj = document.getElementById('addSubject').value.trim();
  const content = document.getElementById('addContent').value.trim();
  const tier = document.getElementById('addTier').value;
  let action;
  if (op === 'addReading') {
    if (!subj || !content) { alert('字 與 注音 都要填'); return; }
    const norm = normalizeReading(content);
    if (!isValidZhuyin(norm, 1)) {
      alert(`格式錯誤：注音請只填一個音節\n例：ㄏㄜˊ\n你輸入：${content}\n推測為：${norm || '(無法解析)'}`);
      document.getElementById('addContent').value = norm || content;
      document.getElementById('addContent').focus();
      return;
    }
    action = { type: 'manual_add_reading', char: subj,
               new_reading: norm, new_dict_key: readingToDictKey(norm), to_tier: tier };
  } else {
    if (!subj) { alert('詞不可空'); return; }
    const norm = content ? normalizeReading(content) : '';
    const expected = Array.from(subj).length;
    if (norm && !isValidZhuyin(norm, expected)) {
      alert(`格式錯誤：注音需 ${expected} 個音節，空格分隔\n例：ㄏㄠˇ ㄩㄣˋ\n你輸入：${content}\n推測為：${norm || '(無法解析)'}`);
      document.getElementById('addContent').value = norm || content;
      document.getElementById('addContent').focus();
      return;
    }
    action = { type: 'manual_add_word', word: subj, z: norm, tier };
  }
  closeAddModal();
  await runGroup(groupKey, () => ['agreed', action]);
}

// ── 列（卡片）──
const subjectLabel = g => g.type === 'feedback' ? (g.members[0].subject || '（無主旨）') : g.subject;

// 按鈕一律用 data-* 屬性＋下面的事件委派，不把任何使用者字串拼進 on* 屬性（B5）
function bt(g, cls, label, act, extra = '', aria = '') {
  const dis = busyGroups.has(g.key) || batchBusy || layerBusy ? ' disabled' : '';
  const a = aria ? ` aria-label="${esc(aria)}" title="${esc(aria)}"` : '';
  return `<button type="button" class="btn ${cls}"${dis}${a} data-act="${act}" data-group="${esc(g.key)}"${extra}>${label}</button>`;
}
const opAttr = op => ` data-op="${op}"`;

// 各回報類型除了「核准／駁回」之外的專用按鈕：[樣式, 文字, 動作, op]
function typeExtras(g) {
  const rt = g.reportType;
  if (g.type === 'char-reading-report') {
    if (rt === '讀音錯誤') return [['btn-hide', '🙈 隱藏', 'op', 'hideReading'], ['btn-remove', '🗑 移除', 'op', 'removeReading'], ['btn-fix', '✏️ 修正', 'edit', 'fixReading']];
    if (rt === '建議讀音') return [['btn-add', '✓ 新增為新讀音', 'add-from-suggest'], ['btn-fix', '✏️ 取代舊讀音', 'replace-reading']];
    if (rt === '極度冷僻') return [['btn-remove', '🗑 完全移除', 'op', 'removeReading']];
    if (rt === '不該出現') return [['btn-hide', '🙈 隱藏', 'op', 'hideReading']];
    return [];
  }
  if (rt === '押韻錯誤' || rt === '詞不存在') return [['btn-hide', '🙈 隱藏', 'op', 'hideWord'], ['btn-remove', '🗑 移除', 'op', 'removeWord'], ['btn-fix', '✏️ 修正注音', 'edit', 'fixWord']];
  if (rt === '建議讀音') return [['btn-add', '✓ 採用建議', 'edit', 'fixWord']];
  if (rt === '讀音錯誤') return [['btn-fix', '✏️ 修正注音', 'edit', 'fixWord']];
  if (rt === '極度冷僻') return [['btn-remove', '🗑 完全移除', 'op', 'removeWord']];
  if (rt === '不該出現') return [['btn-hide', '🙈 隱藏', 'op', 'hideWord']];
  if (rt === '重複出現') return [['btn-remove', '🗑 移除', 'op', 'removeWord']];
  if (rt === '缺字')     return [['btn-add', '✓ 新增（可編輯）', 'add-modal', 'addWord']];
  if (rt === '其他')     return [['btn-note', '📝 備註', 'edit', 'note']];
  return [];
}

function aiInfo(r) {
  const isModify = r.action_kind === 'modify' || (r.modified && r.modified !== r.word);
  // 收錄目標詞：modify 用 modified，否則用原詞
  const targetWord = isModify ? (r.modified || r.word || '') : (r.word || '');
  const autoZ = lookupWordZhuyin(targetWord);
  return { isModify, autoZ, hasMissing: autoZ.includes('?') };
}

// 列內只要有一筆在線上就有「撤回」（例如已上線的三筆之後又來一筆新回報）；撤回只動線上的那幾筆
function rowActions(g) {
  const live = g.st.counts.live ? bt(g, 'btn-undo btn-revoke', '撤回', 'revoke', '', `從線上撤回「${subjectLabel(g)}」的修正`) : '';
  return baseActions(g) + live;
}
function baseActions(g) {
  const st = g.st, rep = g.members[0], n = g.members.length, name = subjectLabel(g);
  const ar = verb => `${verb}「${name}」的回報（${n} 筆）`;
  const archive = bt(g, 'btn-archive', '📦 Archive', 'archive');
  if (st.status === 'pending') {
    if (MERGED_TYPES.includes(g.type)) {
      const op = approveOpFor(g);
      return (op ? bt(g, 'btn-approve', '核准', 'approve', '', ar('核准')) : '<span class="manual-note">需手動</span>')
           + bt(g, 'btn-dismiss', '駁回', 'dismiss', '', ar('駁回'))
           + typeExtras(g).map(([cls, label, act, op2]) => bt(g, cls, label, act, op2 ? opAttr(op2) : '')).join('')
           + archive;
    }
    if (g.type === 'ai-word-suggest') {
      const { isModify } = aiInfo(rep);
      return bt(g, 'btn-add', isModify ? '✓ 同意修改後收錄' : '✓ 同意收錄', 'ai', ` data-mode="${isModify ? 'modify' : 'accept'}"`)
           + bt(g, 'btn-dismiss', '忽略', 'dismiss') + archive;
    }
    if ((rep.subject || '').includes('缺少讀音')) {
      return bt(g, 'btn-add', '✓ 同意（新增）', 'add-modal', opAttr('addReading'))
           + bt(g, 'btn-dismiss', '忽略', 'dismiss') + archive;
    }
    return bt(g, 'btn-dismiss', '✓ 已讀', 'dismiss')
         + bt(g, 'btn-note', '📝 備註', 'edit', opAttr('note')) + archive;
  }
  if (st.status === 'live' || st.status === 'written') return '';   // 已寫進資料檔的不在修正層裡，沒有東西可撤回
  if (st.status === 'archived') {
    return bt(g, 'btn-undo', '↩ 還原', 'undo') + bt(g, 'btn-delete', '🗑 永久刪除', 'delete');
  }
  return bt(g, 'btn-undo', st.status === 'approved' ? '改回待審' : '↩ 還原', 'undo') + archive;
}

// 展開後列出的每一筆原文：時間・狀態・說明（note 與 suggested 都顯示），最新的在前
function originalsHtml(g) {
  return g.members.map(m => {
    const text = (m.note ? `<div class="card-text">${esc(m.note)}</div>` : '')
               + (m.body ? `<div class="card-text">${esc(m.body)}</div>` : '')
               + (m.suggested ? `<div class="card-text">建議：<b>${esc(m.suggested)}</b></div>` : '');
    return `<div class="orig">
        <div class="orig-meta"><span class="card-time">${esc(fmtTime(m.ts))}</span><span class="mini-badge">${esc(STATUS_NAME[memberStatus(m)])}</span></div>
        ${text || '<div class="card-text no-note">（沒有說明）</div>'}
      </div>`;
  }).join('');
}
function toggleLabels(g, open) {
  const n = g.members.length, name = subjectLabel(g);
  return open ? { text: '▾ 收合', aria: `收合「${name}」的 ${n} 筆原文` }
              : { text: `▸ 展開 ${n} 筆原文`, aria: `展開「${name}」的 ${n} 筆原文` };
}
function toggleOriginals(groupKey, btnEl) {
  const g = findGroup(groupKey);
  if (!g) return;
  const open = !expanded.has(groupKey);
  if (open) expanded.add(groupKey); else expanded.delete(groupKey);
  const card = btnEl.closest('.card');
  card.querySelector('.row-originals').hidden = !open;
  const l = toggleLabels(g, open);
  btnEl.textContent = l.text;
  btnEl.setAttribute('aria-expanded', String(open));
  btnEl.setAttribute('aria-label', l.aria);
}

function renderGroupRow(g) {
  const st = g.st, rep = g.members[0], n = g.members.length, name = subjectLabel(g);
  const merged = MERGED_TYPES.includes(g.type);
  const editing = _editing && _editing.groupKey === g.key;
  const sel = selectedGroups.has(g.key);
  const open = expanded.has(g.key);
  const cls = PREVIEW_CLASS[st.status] || '';

  let badge, headline, body = '';
  if (g.type === 'char-reading-report') {
    badge = '<span class="card-type-badge reading">讀音回報</span>';
    headline = `<span class="card-char">${esc(rep.char || '')}</span><span class="card-reading">${esc(rep.reading || '')}</span>
      <span class="card-reason">${esc(g.reportType)}</span>`;
  } else if (g.type === 'word-report') {

  } else if (g.type === 'ai-word-suggest') {
    const { isModify, autoZ, hasMissing } = aiInfo(rep);
    badge = '<span class="card-type-badge feedback">AI 建議收錄</span>';
    const arrow = isModify ? `<span class="modify-arrow">→</span><span class="card-word">${esc(rep.modified || '')}</span>` : '';
    headline = `<span class="card-word">${esc(rep.word || '')}</span>${arrow}

    if (st.status === 'pending') {
      body = `<div class="edit-panel" style="margin-top:10px">

        <input data-act="ai-input" data-group="${esc(g.key)}" data-mode="${isModify ? 'modify' : 'accept'}" value="${esc(autoZ)}" placeholder="ㄔㄣˊ ㄒㄧ ㄨㄟˊ ㄌㄧㄤˋ"${hasMissing ? ' class="warn-input"' : ''}>

      </div>`;
    }
  } else {
    badge = '<span class="card-type-badge feedback">一般回饋</span>';
    headline = `<span class="card-subject">${esc(rep.subject || '（無主旨）')}</span>`;
    body = rep.body ? `<div class="card-text">${esc(rep.body)}</div>` : '';
  }

  let mergedHtml = '', times = esc(fmtTime(g.latest));
  if (merged) {
    const l = toggleLabels(g, open);

    mergedHtml = `<button type="button" class="row-toggle" data-act="toggle" data-group="${esc(g.key)}" aria-expanded="${open}" aria-label="${esc(l.aria)}">${l.text}</button>

  const pill = merged ? `<span class="count-pill${n >= 3 ? ' many' : ''}">×${n}</span>` : '';
  const err = rowErrors.get(g.key);

  const liveBadge = st.counts.live ? '<span class="live-badge">已上線</span>' : '';   // 文字標明，不只靠顏色
  return `<div class="card group ${esc(cls || 'pending')}${sel ? ' selected' : ''}" data-group="${esc(g.key)}">
    <div class="card-header">
      <label class="row-check-wrap"><input type="checkbox" class="row-check" data-act="check" data-group="${esc(g.key)}" aria-label="${esc('選取 ' + name + ' 的回報')}"${sel ? ' checked' : ''}></label>
      ${badge}${headline}${liveBadge}${pill}<span class="card-time">${times}</span>
    </div>
    ${mergedHtml}
    ${body}
    <div class="card-actions">
      <span class="action-preview ${esc(cls)}">${esc(previewForGroup(g))}</span>
      ${editing ? '' : rowActions(g)}
    </div>
    ${err ? `<div class="row-error" role="alert">${esc(err)}</div>` : ''}
    ${editing ? editPanelHTML() : ''}
  </div>`;
}

// 從列內的輸入框取注音，再走 execGroup
function execAI(groupKey, mode) {
  const inp = Array.from(document.querySelectorAll('input[data-act="ai-input"]')).find(i => i.dataset.group === groupKey);
  const g = findGroup(groupKey);
  const raw = (inp?.value || '').trim();
  if (!g) return;
  if (!raw) { alert('請填注音'); inp?.focus(); return; }
  // 含「?」的缺字 placeholder 允許保留，但其它部分仍要正規化成注音
  const hasQ = raw.includes('?');
  const r = g.members[0];
  const targetWord = mode === 'accept' ? r.word : (r.modified || r.word);
  const expected = targetWord ? Array.from(targetWord).length : null;
  let z;
  if (hasQ) {
    // 逐音節：「?」保留，其它正規化
    z = raw.split(/\s+/).map(t => t === '?' ? '?' : normalizeSyllable(t)).join(' ');
    // 校驗每音節必須是 ? 或合法注音
    const parts = z.split(' ');
    const okLen = expected == null || parts.length === expected;
    const okEach = parts.every(p => p === '?' || /^[ㄅ-ㄩ]+[ˊˇˋ˙]?$/.test(p));
    if (!okLen || !okEach) {
      alert(`格式錯誤：請用注音 + 空格分隔（缺字位置可留「?」）\n例：ㄏㄠˇ ?\n你輸入：${raw}\n推測為：${z}`);
      inp.value = z; inp.focus(); inp.select();
      return;
    }
    if (!confirm('注音含「?」（缺字），仍要送出嗎？')) { inp.focus(); return; }
  } else {
    z = normalizeReading(raw);
    if (!isValidZhuyin(z, expected)) {
      alert(`格式錯誤：請用注音 + 空格分隔${expected ? '（需 ' + expected + ' 個音節）' : ''}\n例：ㄏㄠˇ ㄩㄣˋ\n你輸入：${raw}\n推測為：${z || '(無法解析)'}`);
      inp.value = z || raw; inp.focus(); inp.select();
      return;
    }
  }
  inp.value = z;
  execGroup(groupKey, mode === 'accept' ? 'acceptAI' : 'modifyAI', z);
}

// 補相容：reports 中可能有 r.action_kind 或 r.action='accept'/'modify'（從前端送的 schema）
function normalizeAISuggest(r) {
  if (r.type !== 'ai-word-suggest') return;
  if (!r.action_kind && r.action && typeof r.action === 'string') {
    r.action_kind = r.action;  // 從前端 postFeedback 來的 raw 欄位
    delete r.action;           // 避免跟 decision.action 撞名
  }
}

// ── Helpers ──
function tierLabel(t) {
  return { common: '常用', normal: '一般', rare: '冷僻' }[t] || t;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

// ── 多選互動（以「列」為單位）──
function updateBatchBar() {
  // 不在目前畫面上的列（換了篩選、被刪掉）不算選取，批次不會動到看不見的列
  const vis = new Set(visibleKeys);
  for (const k of Array.from(selectedGroups)) if (!vis.has(k)) selectedGroups.delete(k);
  document.querySelectorAll('.card[data-group]').forEach(c => {
    const on = selectedGroups.has(c.dataset.group);
    c.classList.toggle('selected', on);
    const cb = c.querySelector('.row-check');
    if (cb) cb.checked = on;
  });
  const picked = visibleKeys.filter(k => selectedGroups.has(k)).length;
  const sa = document.getElementById('selectAll');
  if (sa) {
    sa.checked = visibleKeys.length > 0 && picked === visibleKeys.length;
    sa.indeterminate = picked > 0 && picked < visibleKeys.length;
  }
  const bar = document.getElementById('batchBar');
  bar.classList.toggle('show', selectedGroups.size > 0);
  bar.classList.toggle('busy', batchBusy);
  bar.querySelectorAll('button').forEach(b => { b.disabled = batchBusy; });
  const cnt = selectedGroups.size;
  document.getElementById('batchCount').textContent = cnt;
  document.getElementById('batchApprove').setAttribute('aria-label', `核准選取的 ${cnt} 列回報`);
  document.getElementById('batchDismiss').setAttribute('aria-label', `駁回選取的 ${cnt} 列回報`);
}
function clearSelection() {
  if (batchBusy) return;
  selectedGroups.clear(); _lastClickedKey = null; updateBatchBar();
}
function selectRange(fromKey, toKey) {
  const keys = Array.from(document.querySelectorAll('.card[data-group]')).map(c => c.dataset.group);
  const i = keys.indexOf(fromKey), j = keys.indexOf(toKey);
  if (i < 0 || j < 0) { selectedGroups.add(toKey); return; }
  const [a, b] = i < j ? [i, j] : [j, i];
  for (let k = a; k <= b; k++) selectedGroups.add(keys[k]);
}

document.addEventListener('mousedown', e => {
  if (e.button !== 0 || batchBusy) return;
  // 點到互動元素 → 完全不介入（按鈕、輸入框、modal 內部）
  if (e.target.closest('button, input, textarea, select, a, label, .modal, .modal-overlay, .batch-bar, .topbar, .apply-bar')) return;
  // modal 開啟時整個畫面凍結，不啟動框選
  if (document.querySelector('.modal-overlay.show')) return;
  const card = e.target.closest('.card[data-group]');
  if (card) {
    const k = card.dataset.group;
    if (e.shiftKey && _lastClickedKey) {
      if (!(e.metaKey || e.ctrlKey)) selectedGroups.clear();
      selectRange(_lastClickedKey, k);
    } else if (e.metaKey || e.ctrlKey) {
      if (selectedGroups.has(k)) selectedGroups.delete(k); else selectedGroups.add(k);
    } else {
      const alreadyOnly = selectedGroups.has(k) && selectedGroups.size === 1;
      selectedGroups.clear();
      if (!alreadyOnly) selectedGroups.add(k);
    }
    _lastClickedKey = k;
    e.preventDefault();
    updateBatchBar();
    return;
  }
  // 點到空白 → 開始橡皮筋
  e.preventDefault();
  _marquee = { x0: e.clientX, y0: e.clientY, x1: e.clientX, y1: e.clientY, moved: false,
               additive: e.metaKey || e.ctrlKey || e.shiftKey };
  document.addEventListener('mousemove', onMarqueeMove);
  document.addEventListener('mouseup', onMarqueeUp);
});

function onMarqueeMove(e) {
  if (!_marquee) return;
  _marquee.x1 = e.clientX; _marquee.y1 = e.clientY;
  if (!_marquee.moved &&
      Math.abs(_marquee.x1 - _marquee.x0) + Math.abs(_marquee.y1 - _marquee.y0) > 4) {
    _marquee.moved = true;
    document.getElementById('marqueeBox').style.display = 'block';
  }
  if (_marquee.moved) {
    e.preventDefault();
    const box = document.getElementById('marqueeBox');
    const x = Math.min(_marquee.x0, _marquee.x1);
    const y = Math.min(_marquee.y0, _marquee.y1);
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width  = Math.abs(_marquee.x1 - _marquee.x0) + 'px';
    box.style.height = Math.abs(_marquee.y1 - _marquee.y0) + 'px';
    // 即時預覽：相交即選
    if (!_marquee.additive) selectedGroups.clear();
    document.querySelectorAll('.card[data-group]').forEach(c => {
      const r = c.getBoundingClientRect();
      const hit = !(r.right < x || r.left > x + parseFloat(box.style.width) ||
                    r.bottom < y || r.top > y + parseFloat(box.style.height));
      if (hit) selectedGroups.add(c.dataset.group);
    });
    updateBatchBar();
  }
}
function onMarqueeUp() {
  document.removeEventListener('mousemove', onMarqueeMove);
  document.removeEventListener('mouseup', onMarqueeUp);
  document.getElementById('marqueeBox').style.display = 'none';
  if (_marquee && !_marquee.moved && !_marquee.additive) {
    // 純空白點擊 → 清除
    selectedGroups.clear(); _lastClickedKey = null; updateBatchBar();
  }
  _marquee = null;
}

// 批次動作：對選到的每一列各跑一次（列與列最多 4 列同時，列內依序），失敗的列留著選取
async function batchRun(keys, decideOf) {
  batchBusy = true; applyMsg = null;
  keys.forEach(k => { busyGroups.add(k); rowErrors.delete(k); });
  render();
  const failed = [];
  await pool(keys, 4, async k => {
    const g = findGroup(k);
    const ok = g ? await decideMembers(g, decideOf(g), 1) : false;
    if (!ok) failed.push(k);
  });
  batchBusy = false;
  keys.forEach(k => busyGroups.delete(k));
  failed.forEach(k => rowErrors.set(k, MSG_ROW));
  keys.forEach(k => { if (!failed.includes(k)) selectedGroups.delete(k); });
  _lastClickedKey = null;
  render();
  return failed;
}
const fullyLocked = g => g.members.every(isLocked);
const LOCKED_NOTE = n => `略過 ${n} 列（已上線，請先撤回）`;
function showBatchResult(text) {
  batchResult = text;
  const el = document.getElementById('batchResult');
  el.textContent = text; el.hidden = !text;
  clearTimeout(_batchResultTimer);
  if (text) _batchResultTimer = setTimeout(() => showBatchResult(''), 4000);
}
// 核准／駁回／封存／還原共用：已上線的列略過，失敗的列留著選取；回傳 { ok, failed, locked }
async function batchDecide(groups, decideOf) {
  const locked = groups.filter(fullyLocked).length;
  const todo = groups.filter(g => !fullyLocked(g));
  showBatchResult('');
  const failed = todo.length ? await batchRun(todo.map(g => g.key), decideOf) : [];
  return { ok: todo.length - failed.length, failed: failed.length, locked, todo: todo.length };
}
const failText = r => `已處理 ${r.ok} 列，${r.failed} 列失敗，失敗的仍保持選取，可以再按一次`;
const selectedRows = () => Array.from(selectedGroups).map(findGroup).filter(Boolean);

async function batchApprove() {
  if (batchBusy) return;
  const groups = selectedRows();
  const manual = groups.filter(g => !fullyLocked(g) && !approveOpFor(g));
  const doable = groups.filter(g => approveOpFor(g) && !fullyLocked(g));
  if (!doable.length) {
    const locked = groups.filter(fullyLocked).length;
    showBatchResult(manual.length || !locked ? '選到的列都需要手動輸入，沒有核准任何一列' : LOCKED_NOTE(locked));
    return;
  }
  const r = await batchDecide(doable.concat(groups.filter(fullyLocked)), g => decideFor(approveOpFor(g)));
  if (r.failed) { showBatchResult(failText(r)); return; }
  // 需手動的列不算處理過，一併取消選取，免得下次又被帶進來
  manual.forEach(g => selectedGroups.delete(g.key)); updateBatchBar();
  showBatchResult(`已核准 ${r.ok} 列`
    + (manual.length ? `，略過 ${manual.length} 列（需要輸入新讀音）` : '')
    + (r.locked ? `，${LOCKED_NOTE(r.locked)}` : ''));
}
async function batchDismiss() {
  if (batchBusy) return;
  const groups = selectedRows();
  if (!groups.length) return;
  const r = await batchDecide(groups, () => decideFor('dismiss'));
  if (r.failed) { showBatchResult(failText(r)); return; }
  showBatchResult(r.todo ? `已駁回 ${r.ok} 列` + (r.locked ? `，${LOCKED_NOTE(r.locked)}` : '') : LOCKED_NOTE(r.locked));
}
async function batchArchive() {
  const groups = selectedRows().filter(g => g.st.status !== 'archived');
  if (!groups.filter(g => !fullyLocked(g)).length) { alert('沒有可封存的項目'); return; }
  if (!confirm(`封存 ${groups.filter(g => !fullyLocked(g)).length} 列？`)) return;
  const r = await batchDecide(groups, () => decideFor('archive'));
  showBatchResult(r.failed ? failText(r) : `已封存 ${r.ok} 列` + (r.locked ? `，${LOCKED_NOTE(r.locked)}` : ''));
}
async function batchRestore() {
  const groups = selectedRows().filter(g => g.st.status !== 'pending');
  if (!groups.filter(g => !fullyLocked(g)).length) { alert('沒有可還原的項目（已是待審狀態）'); return; }
  if (!confirm(`還原 ${groups.filter(g => !fullyLocked(g)).length} 列為待審？`)) return;
  const r = await batchDecide(groups, () => decideFor('undo'));
  showBatchResult(r.failed ? failText(r) : `已還原 ${r.ok} 列` + (r.locked ? `，${LOCKED_NOTE(r.locked)}` : ''));
}
function batchDelete() {
  const groups = selectedRows();
  const locked = groups.filter(fullyLocked).length;
  const p = groups.length ? deleteGroups(groups.map(g => g.key)) : null;   // 確認通過後 deleteMembers 會立刻重畫，被刪的列自然從選取清單剔掉
  if (locked) showBatchResult(LOCKED_NOTE(locked));
  return p;
}

// ── 事件委派（B5）：所有列內按鈕都是 data-act，不在 HTML 屬性裡放程式 ──
const mainEl = document.getElementById('main');
mainEl.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, gk = el.dataset.group;
  switch (act) {
    case 'check':
      if (batchBusy) { e.preventDefault(); return; }
      if (el.checked && e.shiftKey && _lastClickedKey) selectRange(_lastClickedKey, gk);
      else if (el.checked) selectedGroups.add(gk); else selectedGroups.delete(gk);
      _lastClickedKey = gk; updateBatchBar(); return;
    case 'select-all':
      if (batchBusy) { e.preventDefault(); return; }
      for (const k of visibleKeys) { if (el.checked) selectedGroups.add(k); else selectedGroups.delete(k); }
      _lastClickedKey = null; updateBatchBar(); return;
    case 'filter':           filter = el.dataset.filter; render(); return;
    case 'approve':          return approveGroup(gk);
    case 'dismiss':          return execGroup(gk, 'dismiss');
    case 'archive':          return execGroup(gk, 'archive');
    case 'undo':             return execGroup(gk, 'undo');
    case 'delete':           return execGroup(gk, 'delete');
    case 'op':               return execGroup(gk, el.dataset.op);
    case 'edit':             return openEdit(gk, el.dataset.op);
    case 'toggle':           return toggleOriginals(gk, el);
    case 'add-modal':        return openAddModal(gk, el.dataset.op);
    case 'replace-reading':  return openReplaceReading(gk);
    case 'add-from-suggest': return openAddReadingFromSuggest(gk);
    case 'ai':               return execAI(gk, el.dataset.mode);
    case 'apply':            return applyApproved();
    case 'revoke':           return revokeGroup(gk);
    case 'layer-retry':      return retryLayer();
  }
});
mainEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-act="ai-input"]')) execAI(e.target.dataset.group, e.target.dataset.mode);
});

// ── 開啟即載入（若已有 key）──
if (savedKey) reload();
</script>
