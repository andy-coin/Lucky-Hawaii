<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- phone -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="好韻器">
    <link rel="apple-touch-icon" href="icon.png">
    <!-- computer -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好韻器 | Good Rhyming </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --bg-gradient-1: #667eea;
            --bg-gradient-2: #764ba2;
            --container-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --border: #e2e8f0;
            --card-bg: #f7fafc;
            --highlight-border: #ed8936;
            --shadow: rgba(0, 0, 0, 0.1);
            --header-gradient-1: #e89e61;
            --header-gradient-2: #764ba2;
            --custom-text-color: none;
        }
        
        [data-theme="dark"] {
            --bg-gradient-1: #1a202c;
            --bg-gradient-2: #2d3748;
            --container-bg: #1a202c;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --border: #4a5568;
            --card-bg: #2d3748;
            --header-gradient-1: #2d3748;
            --header-gradient-2: #4a5568;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            transition: background 0.3s ease;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
            transition: all 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            background: linear-gradient(135deg, var(--header-gradient-1) 0%, var(--header-gradient-2) 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        /* 顏色自定義面板 */
        .color-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .color-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: white;
        }
        
        .color-item label {
            min-width: 60px;
            font-weight: 500;
        }
        
        .color-item input[type="color"] {
            width: 30px;
            height: 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        /* 控制面板 */
        .controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .theme-toggle, .zoom-control {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .theme-toggle:hover, .zoom-control:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .zoom-control {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
        }
        
        .zoom-control input[type="range"] {
            width: 80px;
            cursor: pointer;
        }
        
        .search-section {
            padding: 30px;
            border-bottom: 1px solid var(--border);
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        

        .search-input {
            width: 100%;
            padding: 18px 24px;
            font-size: 1.2rem;
            border: 3px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--container-bg);
            color: var(--text-primary);
        }
        
        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .search-hint {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 300;
        }
        
        .options {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        /* 按鈕組 */
        .button-group {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        
        .mode-button {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        
        .mode-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .mode-button:hover:not(.active) {
            background: var(--border);
        }
        
        .results-section {
            padding: 30px;
            min-height: 300px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .results-count {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        /* 分組標題 */
        .group-section {
            margin-bottom: 30px;
        }
        
        .group-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
            padding: 8px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            display: inline-block;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .char-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        .char-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
            border-color: #667eea;
        }
        
        .char-card.selected {
            border-color: var(--highlight-border);
            border-width: 3px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }
        
        .char-main {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        /* 自定義文字顏色：始終優先，不被深色模式覆蓋 */
        .char-main.custom-color {
            color: var(--custom-text-color) !important;
        }
        
        .char-pinyin {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* 常用/冷僻標記 - 可點擊區域 */
        .mark-badge {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            min-width: 32px;
            min-height: 18px;
            line-height: 14px;
        }

        .mark-badge:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }
        
        .mark-badge.common {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .mark-badge.normal {
            background: var(--border);
            color: var(--text-secondary);
        }
        
        .mark-badge.rare {
            background: linear-gradient(135deg, #667eea 0%, #4299e1 100%);
            color: white;
        }
        
        /* 搜尋內容高亮樣式 - 多顏色 */
        .search-highlight-1 { color: #ed8936; font-weight: 700; }
        .search-highlight-2 { color: #48bb78; font-weight: 700; }
        .search-highlight-3 { color: #4299e1; font-weight: 700; }
        .search-highlight-4 { color: #9f7aea; font-weight: 700; }
        .search-highlight-5 { color: #ed64a6; font-weight: 700; }
        
        /* 最近點擊區域 */
        .recent-clicks-section {
            padding: 20px 30px;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
        }
        
        .recent-clicks-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        
        .recent-clicks-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 40px;
        }
        
        .recent-char {
            background: var(--container-bg);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.2rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .recent-char:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .empty-state p {
            font-size: 0.95rem;
        }
        
        .footer {
            padding: 20px 30px;
            background: var(--card-bg);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        @media (max-width: 640px) {
            .header {
                padding: 20px 15px 30px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .search-section {
                padding: 20px 15px;
            }
            
            .search-input {
                font-size: 16px; /* 防止 iOS 自動縮放 */
                padding: 14px 18px;
                -webkit-appearance: none;
                appearance: none;
                border-radius: 12px;
            }
            
            .results-section {
                padding: 15px;
            }
            
            .results-grid {
                grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
                gap: 8px;
            }
            
            .char-card {
                padding: 8px 4px;
            }
            
            .char-main {
                font-size: 1.5rem;
            }
            
            .char-pinyin {
                font-size: 0.7rem;
            }
            
            .mark-badge {
                font-size: 0.6rem;
                padding: 1px 4px;
                min-width: 28px;
            }
            
            .color-panel {
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                margin-bottom: 15px;
                justify-content: center;
            }
            
            .controls {
                position: static;
                justify-content: center;
                margin-top: 15px;
                flex-wrap: wrap;
            }
            
            .options {
                gap: 10px;
            }
            
            .button-group {
                width: 100%;
                justify-content: center;
            }
            
            .recent-clicks-section {
                padding: 15px;
            }
            
            .checkbox-label {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="container" id="mainContainer">
        <div class="header">
            <!-- 顏色自定義面板 -->
            <div class="color-panel">
                <div class="color-item">
                    <label>背景</label>
                    <input type="color" id="bgColor1" value="#667eea">
                </div>
                <div class="color-item">
                    <label>底色</label>
                    <input type="color" id="containerBg" value="#ffffff">
                </div>
                <div class="color-item">
                    <label>文字</label>
                    <input type="color" id="textColor" value="#2d3748">
                </div>
                <div class="color-item">
                    <label>邊框</label>
                    <input type="color" id="highlightColor" value="#ed8936">
                </div>
            </div>
            
            <!-- 控制面板 -->
            <div class="controls">
                <button class="theme-toggle" id="themeToggle"> ☀️ 淺色模式 </button>
                <div class="zoom-control">
                    <span>🔍</span>
                    <input type="range" id="zoomSlider" min="50" max="150" value="100" step="5">
                    <span id="zoomValue">100%</span>
                </div>
            </div>
            
            <h1>韻腳查詢器 📝</h1>
            <p>寫歌詞...不簡單...乾巴爹...早點睡...</p>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="輸入注音或拼音，例如：ㄢ 或 an"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    inputmode="text"
                    enterkeyhint="search"
                >
                <div class="search-hint">
                    💡 支援注音（ㄅㄆㄇ）或拼音（ban、pan）輸入，也可輸入子音（如 ㄈ）查找所有符合該子音開頭的字
                </div>
            </div>
            
            <div class="options">
                <label class="checkbox-label">
                    <input type="checkbox" id="showPinyin" checked>
                    <span>顯示拼音</span>
                </label>
                
                <label class="checkbox-label">
                    <input type="checkbox" id="highlightSearch" checked>
                    <span>標記搜尋</span>
                </label>
                
                <div class="button-group">
                    <button class="mode-button active" data-mode="common">常用字優先</button>
                    <button class="mode-button" data-mode="initial">同子音並列</button>
                </div>
            </div>
        </div>
        
        <div class="results-section">
            <div id="resultsContainer">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <h3>開始搜尋韻腳</h3>
                    <p>在上方輸入注音或拼音來尋找押韻的字</p>
                </div>
            </div>
        </div>
        
        <div class="recent-clicks-section">
            <div class="recent-clicks-title">最近點擊</div>
            <div class="recent-clicks-container" id="recentClicks">
                <span style="color: var(--text-secondary); font-size: 0.9rem;">點擊上方的字來記錄</span>
            </div>
        </div>
        
        <div class="footer">
            創作者專屬工具 · 可離線使用 · 告知作者後可分享 ( 因為還在開發中 >_< )　　　2026.02 beta v1.0
        </div>
    </div>

    <script>
        // ==================== 注音優先架構 v1.0 ====================
        
        // 注音聲母表（21個聲母）
        const zhuyinInitials = ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ',
                               'ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'];
        const zhuyinInitialSet = new Set(zhuyinInitials);
        
        // 拼音聲母表（用於辨識拼音輸入）
        const pinyinInitials = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h',
                               'j','q','x','r','z','c','s'];
        
        // 注音 → 拼音（用於顯示）
        const zhuyinToPinyinMap = {
            // 聲母
            'ㄅ': 'b', 'ㄆ': 'p', 'ㄇ': 'm', 'ㄈ': 'f',
            'ㄉ': 'd', 'ㄊ': 't', 'ㄋ': 'n', 'ㄌ': 'l',
            'ㄍ': 'g', 'ㄎ': 'k', 'ㄏ': 'h',
            'ㄐ': 'j', 'ㄑ': 'q', 'ㄒ': 'x',
            'ㄓ': 'zh', 'ㄔ': 'ch', 'ㄕ': 'sh', 'ㄖ': 'r',
            'ㄗ': 'z', 'ㄘ': 'c', 'ㄙ': 's',
            // 韻母
            'ㄚ': 'a', 'ㄛ': 'o', 'ㄜ': 'e', 'ㄝ': 'e',
            'ㄞ': 'ai', 'ㄟ': 'ei', 'ㄠ': 'ao', 'ㄡ': 'ou',
            'ㄢ': 'an', 'ㄣ': 'en', 'ㄤ': 'ang', 'ㄥ': 'eng', 'ㄦ': 'er',
            'ㄧ': 'i', 'ㄨ': 'u', 'ㄩ': 'ü',
            'ㄧㄚ': 'ia', 'ㄧㄛ': 'io', 'ㄧㄝ': 'ie', 'ㄧㄞ': 'iai', 'ㄧㄠ': 'iao', 'ㄧㄡ': 'iu',
            'ㄧㄢ': 'ian', 'ㄧㄣ': 'in', 'ㄧㄤ': 'iang', 'ㄧㄥ': 'ing',
            'ㄨㄚ': 'ua', 'ㄨㄛ': 'uo', 'ㄨㄞ': 'uai', 'ㄨㄟ': 'ui', 'ㄨㄢ': 'uan', 'ㄨㄣ': 'un',
            'ㄨㄤ': 'uang', 'ㄨㄥ': 'ong',
            'ㄩㄝ': 'üe', 'ㄩㄢ': 'üan', 'ㄩㄣ': 'ün', 'ㄩㄥ': 'iong'
        };
        
        // 拼音韻母 → 注音韻母（用於將拼音輸入轉成注音搜尋）
        // 長的優先匹配，需要按長度排序
        const pinyinRhymeToZhuyin = {
            // 四字母韻母
            'uang': 'ㄨㄤ', 'iang': 'ㄧㄤ', 'iong': 'ㄩㄥ',
            // 三字母韻母
            'iao': 'ㄧㄠ', 'ian': 'ㄧㄢ', 'ing': 'ㄧㄥ', 'iou': 'ㄧㄡ',
            'uai': 'ㄨㄞ', 'uan': 'ㄨㄢ', 'uen': 'ㄨㄣ', 'uei': 'ㄨㄟ',
            'ang': 'ㄤ', 'eng': 'ㄥ', 'ong': 'ㄨㄥ',
            'iai': 'ㄧㄞ',
            // 二字母韻母
            'ia': 'ㄧㄚ', 'io': 'ㄧㄛ', 'ie': 'ㄧㄝ', 'iu': 'ㄧㄡ', 'in': 'ㄧㄣ',
            'ua': 'ㄨㄚ', 'uo': 'ㄨㄛ', 'ui': 'ㄨㄟ', 'un': 'ㄨㄣ',
            've': 'ㄩㄝ', 'ue': 'ㄩㄝ', 'vn': 'ㄩㄣ',
            'ai': 'ㄞ', 'ei': 'ㄟ', 'ao': 'ㄠ', 'ou': 'ㄡ',
            'an': 'ㄢ', 'en': 'ㄣ', 'er': 'ㄦ',
            // 單字母韻母
            'a': 'ㄚ', 'o': 'ㄛ', 'e': 'ㄜ',
            'i': 'ㄧ', 'u': 'ㄨ', 'v': 'ㄩ'
        };
        
        // 拼音聲母 → 注音聲母
        const pinyinInitialToZhuyin = {
            'b': 'ㄅ', 'p': 'ㄆ', 'm': 'ㄇ', 'f': 'ㄈ',
            'd': 'ㄉ', 't': 'ㄊ', 'n': 'ㄋ', 'l': 'ㄌ',
            'g': 'ㄍ', 'k': 'ㄎ', 'h': 'ㄏ',
            'j': 'ㄐ', 'q': 'ㄑ', 'x': 'ㄒ',
            'zh': 'ㄓ', 'ch': 'ㄔ', 'sh': 'ㄕ', 'r': 'ㄖ',
            'z': 'ㄗ', 'c': 'ㄘ', 's': 'ㄙ'
        };
        
        // 特殊拼音整音節 → 注音（處理不規則對應）
        // 這些拼音作為完整搜尋詞時直接對應到注音韻母
        const pinyinSpecialToZhuyin = {
            'weng': 'ㄨㄥ',    // 翁 = ㄨㄥ（獨立音節）
            'yong': 'ㄩㄥ',    // 用 = ㄩㄥ（獨立音節）
            'yuan': 'ㄩㄢ',    // 元 = ㄩㄢ
            'yue': 'ㄩㄝ',     // 月 = ㄩㄝ
            'yun': 'ㄩㄣ',     // 雲 = ㄩㄣ

        };

        // ==================== 注音優先核心函數 ====================
        
        // 從注音字串提取聲母
        function getZhuyinInitial(zhuyin) {
            if (!zhuyin || zhuyin.length === 0) return '';
            if (zhuyinInitialSet.has(zhuyin[0])) {
                return zhuyin[0];
            }
            return ''; // 無聲母（如 ㄢ, ㄧ 等）
        }
        
        // 從注音字串提取韻母
        function getZhuyinRhyme(zhuyin) {
            if (!zhuyin || zhuyin.length === 0) return '';
            if (zhuyinInitialSet.has(zhuyin[0])) {
                const rhyme = zhuyin.substring(1);
                return rhyme || zhuyin; // 純聲母（如 ㄓ=知）時回傳整個
            }
            return zhuyin; // 整個都是韻母
        }
        
        // 拼音輸入 → 注音（用於搜尋轉換）
        function pinyinToZhuyin(pinyin) {
            pinyin = pinyin.toLowerCase().trim();
            
            // 先檢查特殊整音節（weng, yong, yuan 等）
            if (pinyinSpecialToZhuyin[pinyin]) {
                return pinyinSpecialToZhuyin[pinyin];
            }
            
            // 拆分聲母和韻母
            let initial = '';
            let rhymePart = pinyin;
            
            // 嘗試匹配聲母（長的先匹配）
            for (const pi of pinyinInitials) {
                if (pinyin.startsWith(pi) && pinyin.length > pi.length) {
                    initial = pi;
                    rhymePart = pinyin.substring(pi.length);
                    break;
                }
            }
            
            // 轉換聲母
            const zhuyinInitial = initial ? (pinyinInitialToZhuyin[initial] || '') : '';
            
            // 轉換韻母（按長度從長到短匹配）
            let zhuyinRhyme = '';
            const sortedRhymes = Object.keys(pinyinRhymeToZhuyin).sort((a, b) => b.length - a.length);
            for (const pr of sortedRhymes) {
                if (rhymePart === pr) {
                    zhuyinRhyme = pinyinRhymeToZhuyin[pr];
                    break;
                }
            }
            
            // 如果韻母沒匹配到，可能輸入本身就只是聲母
            if (!zhuyinRhyme && !initial && pinyinInitialToZhuyin[pinyin]) {
                return pinyinInitialToZhuyin[pinyin]; // 純聲母搜尋
            }
            
            return zhuyinInitial + zhuyinRhyme;
        }
        
        // 注音 → 拼音（用於顯示）
        function zhuyinToPinyin(zhuyin) {
            if (!zhuyin) return '';
            
            const initial = getZhuyinInitial(zhuyin);
            const rhyme = getZhuyinRhyme(zhuyin);
            
            // 純聲母的情況（如 ㄓ, ㄘ 等）
            if (initial && rhyme === zhuyin) {
                const pi = zhuyinToPinyinMap[initial] || '';
                // 整體認讀音節：加上 i
                if (['ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ'].includes(initial)) {
                    return pi + 'i';
                }
                return pi;
            }
            
            const pInitial = initial ? (zhuyinToPinyinMap[initial] || '') : '';
            
            // 韻母轉換：先查複合韻母（長的先）
            let pRhyme = '';
            const sortedKeys = Object.keys(zhuyinToPinyinMap)
                .filter(k => !zhuyinInitialSet.has(k))
                .sort((a, b) => b.length - a.length);
            for (const zr of sortedKeys) {
                if (rhyme === zr) {
                    pRhyme = zhuyinToPinyinMap[zr];
                    break;
                }
            }
            
            if (!pRhyme) pRhyme = rhyme; // fallback
            
            // 特殊處理：無聲母時的拼寫規則
            if (!initial) {
                if (rhyme === 'ㄧ') return 'yi';
                if (rhyme === 'ㄨ') return 'wu';
                if (rhyme === 'ㄩ') return 'yu';
                if (rhyme.startsWith('ㄧ')) return 'y' + pRhyme.substring(1);
                if (rhyme.startsWith('ㄨ')) return 'w' + pRhyme.substring(1);
                if (rhyme.startsWith('ㄩ')) {
                    // ㄩ 開頭無聲母：yuan, yue, yun, yong
                    if (rhyme === 'ㄩㄢ') return 'yuan';
                    if (rhyme === 'ㄩㄝ') return 'yue';
                    if (rhyme === 'ㄩㄣ') return 'yun';
                    if (rhyme === 'ㄩㄥ') return 'yong';
                    return 'yu';
                }
            }
            
            // 特殊處理：ㄨㄥ 在有聲母時顯示為 ong
            // zhuyinToPinyinMap 已經正確映射 ㄨㄥ→ong
            
            return pInitial + pRhyme;

        // 判斷輸入是否為拼音聲母
        function isPinyinInitial(input) {
            return pinyinInitials.includes(input.toLowerCase());
        }
        
        // 判斷輸入是否為注音聲母
        function isZhuyinInitial(input) {
            return zhuyinInitialSet.has(input);
        }
        
        // 主搜尋邏輯（注音優先）
        function searchRhyme(input) {
            if (!input) {
                searchedTerms = [];
                return [];
            }
            
            input = input.trim();
            lastSearchInput = input;
            
            const isBopomofo = /[ㄅ-ㄩ]/.test(input);
            lastSearchType = isBopomofo ? 'bopomofo' : 'pinyin';
            
            const queries = input.split(/\s+/);
            const allResults = [];
            const seenChars = new Set();
            searchedTerms = [];
            
            queries.forEach((query, queryIndex) => {
                const queryIsBopomofo = /[ㄅ-ㄩ]/.test(query);
                
                // 統一轉成注音進行搜尋
                let zhuyinQuery;
                if (queryIsBopomofo) {
                    zhuyinQuery = query;
                } else {
                    zhuyinQuery = pinyinToZhuyin(query);
                }
                
                if (!zhuyinQuery) return;
                
                // 判斷是否為純聲母搜尋
                const isSingleInitial = zhuyinQuery.length === 1 && zhuyinInitialSet.has(zhuyinQuery);
                // 也檢查拼音聲母（如 'zh', 'ch' 等轉成注音後仍是單一聲母）
                const isPinInitial = !queryIsBopomofo && isPinyinInitial(query.toLowerCase());
                const isInitialSearch = isSingleInitial || isPinInitial;
                
                // 記錄搜尋詞（用於高亮）
                searchedTerms.push({
                    original: query,
                    zhuyin: zhuyinQuery,
                    isInitial: isInitialSearch,
                    index: queryIndex
                });
                
                if (isInitialSearch) {
                    // 聲母搜尋：找所有包含該聲母的字
                    const targetInitial = isSingleInitial ? zhuyinQuery : pinyinInitialToZhuyin[query.toLowerCase()];
                    if (!targetInitial) return;
                    
                    for (let char in chineseDict) {
                        if (seenChars.has(char)) continue;
                        const zhuyinList = chineseDict[char];
                        for (let zy of zhuyinList) {
                            const initial = getZhuyinInitial(zy);
                            if (initial === targetInitial) {
                                const rhyme = getZhuyinRhyme(zy);
                                allResults.push({
                                    char: char,
                                    zhuyin: zy,
                                    pinyin: zhuyinToPinyin(zy),
                                    zhuyinRhyme: rhyme,
                                    zhuyinInitial: initial,
                                    rhymeIndex: queryIndex
                                });
                                seenChars.add(char);
                                break;
                            }
                        }
                    }
                } else {
                    // 韻母搜尋：提取搜尋目標的韻母部分
                    let targetRhyme = zhuyinQuery;
                    // 如果輸入包含聲母，提取韻母
                    if (zhuyinQuery.length > 0 && zhuyinInitialSet.has(zhuyinQuery[0]) && zhuyinQuery.length > 1) {
                        targetRhyme = zhuyinQuery.substring(1);
                    }
                    
                    for (let char in chineseDict) {
                        if (seenChars.has(char)) continue;
                        const zhuyinList = chineseDict[char];
                        for (let zy of zhuyinList) {
                            const rhyme = getZhuyinRhyme(zy);
                            if (rhyme.endsWith(targetRhyme) || rhyme === targetRhyme) {
                                const initial = getZhuyinInitial(zy);
                                allResults.push({
                                    char: char,
                                    zhuyin: zy,
                                    pinyin: zhuyinToPinyin(zy),
                                    zhuyinRhyme: rhyme,
                                    zhuyinInitial: initial,
                                    rhymeIndex: queryIndex
                                });
                                seenChars.add(char);
                                break;
                            }
                        }
                    }
                }
            });
            
            return allResults;
        }


        // 全局狀態
        let currentMode = 'common';
        let selectedChars = new Set();
        let recentClicks = [];
        let lastSearchInput = '';
        let lastSearchType = 'pinyin';
        let searchedTerms = [];
        let hasCustomTextColor = false;

        // 創建字卡
        function createCharCard(item, showPinyin) {
            const isSelected = selectedChars.has(item.char) ? 'selected' : '';
            const highlightSearch = document.getElementById('highlightSearch').checked;
            const mark = getCharMark(item.char);
            const customColorClass = hasCustomTextColor ? 'custom-color' : '';
            
            let displayText = '';
            
            if (showPinyin) {
                const showAsZhuyin = lastSearchType === 'bopomofo';
                const zhuyinInit = item.zhuyinInitial || '';
                const zhuyinRhy = item.zhuyinRhyme || '';
                // 如果韻母就是整個注音（純聲母字如 ㄓ），不拆分
                const isInitialOnly = zhuyinInit && zhuyinRhy === item.zhuyin;
                
                if (showAsZhuyin) {
                    // === 注音顯示模式 ===
                    const dispInit = zhuyinInit;
                    const dispRhyme = isInitialOnly ? '' : zhuyinRhy;
                    
                    if (highlightSearch) {
                        const searchTerm = searchedTerms[item.rhymeIndex] || searchedTerms[0];
                        const colorClass = `search-highlight-${(item.rhymeIndex % 5) + 1}`;
                        if (searchTerm && searchTerm.isInitial) {
                            displayText = `<span class="${colorClass}">${dispInit}</span>${dispRhyme}`;
                        } else {
                            displayText = `${dispInit}<span class="${colorClass}">${dispRhyme || dispInit}</span>`;
                        }
                    } else {
                        displayText = isInitialOnly ? zhuyinInit : (zhuyinInit + zhuyinRhy);
                    }
                } else {
                    // === 拼音顯示模式 ===
                    const pinyinFull = item.pinyin || zhuyinToPinyin(item.zhuyin);
                    // 拆分拼音的聲母和韻母用於高亮
                    let pInit = '';
                    let pRhyme = pinyinFull;
                    for (const pi of pinyinInitials) {
                        if (pinyinFull.startsWith(pi) && pinyinFull.length > pi.length) {
                            pInit = pi;
                            pRhyme = pinyinFull.substring(pi.length);
                            break;
                        }
                    }
                    
                    if (highlightSearch) {
                        const searchTerm = searchedTerms[item.rhymeIndex] || searchedTerms[0];
                        const colorClass = `search-highlight-${(item.rhymeIndex % 5) + 1}`;
                        if (searchTerm && searchTerm.isInitial) {
                            displayText = `<span class="${colorClass}">${pInit}</span>${pRhyme}`;
                        } else {
                            displayText = `${pInit}<span class="${colorClass}">${pRhyme}</span>`;
                        }
                    } else {
                        displayText = pinyinFull;
                    }
                }
            }
            
            // 標記徽章
            let badgeHTML = '';
            if (mark === 'common') {
                badgeHTML = `<span class="mark-badge common" data-char="${item.char}" onclick="handleBadgeClick(event, '${item.char}')">常用</span>`;
            } else if (mark === 'rare') {
                badgeHTML = `<span class="mark-badge rare" data-char="${item.char}" onclick="handleBadgeClick(event, '${item.char}')">冷僻</span>`;
            } else {
                badgeHTML = `<span class="mark-badge normal" data-char="${item.char}" onclick="handleBadgeClick(event, '${item.char}')">一般</span>`;
            }
            
            return `
                <div class="char-card ${isSelected}" data-char="${item.char}">
                    <div class="char-main ${customColorClass}">${item.char}</div>
                    ${showPinyin ? `<div class="char-pinyin">${displayText}</div>` : ''}
                    ${badgeHTML}
                </div>
            `;
        }

        // 延遲重排系統
        let reorderTimer = null;
        const REORDER_DELAY = 3000; // 5秒

        // 處理徽章點擊（阻止冒泡，不觸發選取）
        function handleBadgeClick(event, char) {
            event.stopPropagation();
            event.preventDefault();
            cycleCharMark(char);
            
            // 就地更新徽章外觀（不重排）
            const badge = event.target;
            const newMark = getCharMark(char);
            
            if (newMark === 'common') {
                badge.className = 'mark-badge common';
                badge.textContent = '常用';
            } else if (newMark === 'rare') {
                badge.className = 'mark-badge rare';
                badge.textContent = '冷僻';
            } else {
                badge.className = 'mark-badge normal';
                badge.textContent = '一般';
            }
            
            // 重置/延長 5 秒計時器（共用同一個計時器 = 同區間內累積）
            if (reorderTimer) {
                clearTimeout(reorderTimer);
            }
            reorderTimer = setTimeout(() => {
                reorderTimer = null;
                // 時間到：完整重新渲染（含排序）
                const currentInput = document.getElementById('searchInput').value;
                if (currentInput) {
                    const results = searchRhyme(currentInput);
                    // 加入淡入動畫
                    const container = document.getElementById('resultsContainer');
                    container.style.opacity = '0.001';
                    container.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => {
                        displayResults(results);
                        container.style.opacity = '1';
                    }, 500);
                }
            }, REORDER_DELAY);
        }

        // 切換選中狀態
        function toggleSelection(char, cardElement) {
            if (selectedChars.has(char)) {
                selectedChars.delete(char);
                cardElement.classList.remove('selected');
            } else {
                selectedChars.add(char);
                cardElement.classList.add('selected');
                addToRecentClicks(char);
            }
        }

        // 添加到最近點擊
        function addToRecentClicks(char) {
            recentClicks = recentClicks.filter(c => c !== char);
            recentClicks.unshift(char);
            if (recentClicks.length > 20) {
                recentClicks.pop();
            }
            updateRecentClicksDisplay();
        }

        // 更新最近點擊顯示
        function updateRecentClicksDisplay() {
            const container = document.getElementById('recentClicks');
            if (recentClicks.length === 0) {
                container.innerHTML = '<span style="color: var(--text-secondary); font-size: 0.9rem;">點擊上方的字來記錄</span>';
                return;
            }
            container.innerHTML = recentClicks.map(char => 
                `<span class="recent-char">${char}</span>`
            ).join('');
        }

        // 顯示結果
        function displayResults(results) {
            const container = document.getElementById('resultsContainer');
            const showPinyin = document.getElementById('showPinyin').checked;
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <h3>沒有找到結果</h3>
                        <p>試試其他韻腳，例如：an、ing、ong</p>
                    </div>
                `;
                return;
            }
            
            const header = `
                <div class="results-header">
                    <div class="results-count">找到 ${results.length} 個字</div>
                </div>
            `;
            
            let content = '';
            
            if (currentMode === 'initial') {
                // 同子音並列模式（注音優先）
                const grouped = {};
                results.forEach(item => {
                    const initial = item.zhuyinInitial || '無聲母';
                    if (!grouped[initial]) grouped[initial] = [];
                    grouped[initial].push(item);
                });
                
                const sortedKeys = Object.keys(grouped).sort((a, b) => {
                    if (a === '無聲母') return 1;
                    if (b === '無聲母') return -1;
                    return zhuyinInitials.indexOf(a) - zhuyinInitials.indexOf(b);
                });
                
                // 判斷搜尋輸入格式，決定標題顯示
                const showAsZhuyin = lastSearchType === 'bopomofo';
                
                sortedKeys.forEach(initial => {
                    let displayTitle = initial;
                    if (initial !== '無聲母' && !showAsZhuyin) {
                        // 拼音輸入 → 標題顯示拼音
                        displayTitle = zhuyinToPinyinMap[initial] || initial;
                    }
                    // 注音輸入 → 標題直接是注音（原生）
                    
                    // 每組內也按三級排序
                    grouped[initial].sort((a, b) => {
                        const markA = getCharMark(a.char);
                        const markB = getCharMark(b.char);
                        const orderA = markA === 'common' ? 0 : (markA === 'rare' ? 2 : 1);
                        const orderB = markB === 'common' ? 0 : (markB === 'rare' ? 2 : 1);
                        return orderA - orderB;
                    });
                    
                    content += `
                        <div class="group-section">
                            <div class="group-title">[${displayTitle}]</div>
                            <div class="results-grid">
                                ${grouped[initial].map(item => createCharCard(item, showPinyin)).join('')}
                            </div>
                        </div>
                    `;
                });
            } else {
                // 常用字優先模式：三級排序
                results.sort((a, b) => {
                    const markA = getCharMark(a.char);
                    const markB = getCharMark(b.char);
                    const orderA = markA === 'common' ? 0 : (markA === 'rare' ? 2 : 1);
                    const orderB = markB === 'common' ? 0 : (markB === 'rare' ? 2 : 1);
                    return orderA - orderB;
                });
                
                content = `<div class="results-grid">
                    ${results.map(item => createCharCard(item, showPinyin)).join('')}
                </div>`;
            }
            
            container.innerHTML = header + content;
            
            // 點擊事件（使用事件委派，支援觸控）
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.onclick = function(e) {
                // 如果點擊的是徽章，不處理（由 onclick 直接處理）
                if (e.target.classList.contains('mark-badge')) return;
                
                // 找到最近的 .char-card
                const card = e.target.closest('.char-card');
                if (card) {
                    const char = card.dataset.char;
                    toggleSelection(char, card);
                }
            };
        }

        // 事件監聽器
        const searchInputEl = document.getElementById('searchInput');
        
        // 標準 input 事件
        searchInputEl.addEventListener('input', (e) => {
            // 如果正在輸入法組字中（如注音輸入法），跳過
            if (e.isComposing) return;
            const results = searchRhyme(e.target.value);
            displayResults(results);
        });
        
        // 輸入法組字完成事件（支援手機注音/拼音輸入法）
        searchInputEl.addEventListener('compositionend', (e) => {
            const results = searchRhyme(e.target.value);
            displayResults(results);
        });
        
        // 確保手機上點擊搜尋框能正確取得焦點
        searchInputEl.addEventListener('touchend', (e) => {
            setTimeout(() => e.target.focus(), 10);
        });

        document.getElementById('showPinyin').addEventListener('change', () => {
            const currentInput = document.getElementById('searchInput').value;
            if (currentInput) {
                const results = searchRhyme(currentInput);
                displayResults(results);
            }
        });
        
        document.getElementById('highlightSearch').addEventListener('change', () => {
            const currentInput = document.getElementById('searchInput').value;
            if (currentInput) {
                const results = searchRhyme(currentInput);
                displayResults(results);
            }
        });

        // 按鈕組切換
        document.querySelectorAll('.mode-button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.mode-button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                const currentInput = document.getElementById('searchInput').value;
                if (currentInput) {
                    const results = searchRhyme(currentInput);
                    displayResults(results);
                }
            });
        });

        // Dark mode 切換
        const themeToggle = document.getElementById('themeToggle');
        let isDark = false;
        
        // 顏色反轉工具函數
        function invertColor(hex) {
            hex = hex.replace('#', '');
            const r = 255 - parseInt(hex.substring(0, 2), 16);
            const g = 255 - parseInt(hex.substring(2, 4), 16);
            const b = 255 - parseInt(hex.substring(4, 6), 16);
            return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
        }
        
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? '🌙 深色模式' : '☀️ 淺色模式' ;
            
            // 重新載入顏色（含反轉邏輯）
            loadColors();
            
            // 重新渲染結果以套用顏色
            const currentInput = document.getElementById('searchInput').value;
            if (currentInput) {
                const results = searchRhyme(currentInput);
                displayResults(results);
            }
        });

        // 縮放功能（使用 CSS zoom 而非 transform，修復手機輸入問題）
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValue = document.getElementById('zoomValue');
        const mainContainer = document.getElementById('mainContainer');

        zoomSlider.addEventListener('input', (e) => {
            zoomValue.textContent = e.target.value + '%';
        });
        
        zoomSlider.addEventListener('change', (e) => {
            const value = parseInt(e.target.value);
            const scale = value / 100;
            
            // 使用 CSS zoom（不影響 input focus）
            // 檢查視窗寬度限制
            const containerWidth = mainContainer.offsetWidth;
            const viewportWidth = window.innerWidth - 40;
            const scaledWidth = containerWidth * scale;
            
            if (scaledWidth > viewportWidth && scale > 1) {
                const maxScale = viewportWidth / containerWidth;
                const maxValue = Math.floor(maxScale * 100 / 5) * 5;
                zoomSlider.value = maxValue;
                zoomValue.textContent = maxValue + '%';
                mainContainer.style.zoom = maxValue / 100;
                mainContainer.style.transform = 'none';
            } else {
                mainContainer.style.zoom = scale;
                mainContainer.style.transform = 'none';
            }
        });

        // 顏色自定義
        function loadColors() {
            // 從 localStorage 讀取原始（淺色模式）顏色
            const rawColors = {
                bgColor1: localStorage.getItem('bgColor1') || '#667eea',
                containerBg: localStorage.getItem('containerBg') || '#ffffff',
                textColor: localStorage.getItem('textColor') || '#2d3748',
                highlightColor: localStorage.getItem('highlightColor') || '#ed8936'
            };
            
            // 深色模式：背景以外的顏色反轉
            let displayColors;
            if (isDark) {
                displayColors = {
                    bgColor1: rawColors.bgColor1, // 背景不反轉
                    containerBg: invertColor(rawColors.containerBg),
                    textColor: invertColor(rawColors.textColor),
                    highlightColor: invertColor(rawColors.highlightColor)
                };
            } else {
                displayColors = { ...rawColors };
            }
            
            // 更新色票 UI 顯示當前實際使用的顏色
            document.getElementById('bgColor1').value = rawColors.bgColor1; // 背景永遠顯示原色
            document.getElementById('containerBg').value = displayColors.containerBg;
            document.getElementById('textColor').value = displayColors.textColor;
            document.getElementById('highlightColor').value = displayColors.highlightColor;
            
            applyColors(displayColors, rawColors.textColor);
        }

        function applyColors(colors, rawTextColor) {
            // 背景不受深色模式影響（深色模式有自己的背景）
            if (!isDark) {
                document.documentElement.style.setProperty('--bg-gradient-1', colors.bgColor1);
                document.documentElement.style.setProperty('--bg-gradient-2', colors.bgColor1);
            }
            document.documentElement.style.setProperty('--container-bg', colors.containerBg);
            document.documentElement.style.setProperty('--highlight-border', colors.highlightColor);
            
            // 文字顏色
            const defaultTextColor = '#2d3748';
            const originalTextColor = rawTextColor || colors.textColor;
            if (originalTextColor !== defaultTextColor || isDark) {
                hasCustomTextColor = true;
                document.documentElement.style.setProperty('--custom-text-color', colors.textColor);
                document.documentElement.style.setProperty('--text-primary', colors.textColor);
            } else {
                hasCustomTextColor = false;
                document.documentElement.style.setProperty('--text-primary', colors.textColor);
            }
        }

        document.getElementById('bgColor1').addEventListener('change', (e) => {
            // 背景不反轉，直接儲存
            localStorage.setItem('bgColor1', e.target.value);
            loadColors();
        });

        document.getElementById('containerBg').addEventListener('change', (e) => {
            // 深色模式下使用者選的是反轉後的顏色，需反轉回原色再儲存
            const rawValue = isDark ? invertColor(e.target.value) : e.target.value;
            localStorage.setItem('containerBg', rawValue);
            loadColors();
        });

        document.getElementById('textColor').addEventListener('change', (e) => {
            const rawValue = isDark ? invertColor(e.target.value) : e.target.value;
            localStorage.setItem('textColor', rawValue);
            loadColors();
            // 重新渲染以套用 custom-color class
            const currentInput = document.getElementById('searchInput').value;
            if (currentInput) {
                const results = searchRhyme(currentInput);
                displayResults(results);
            }
        });

        document.getElementById('highlightColor').addEventListener('change', (e) => {
            const rawValue = isDark ? invertColor(e.target.value) : e.target.value;
            localStorage.setItem('highlightColor', rawValue);
            loadColors();
        });

        // 初始化
        loadUserMarks();
        loadColors();
        // 只在桌面自動 focus（避免手機打開就彈出鍵盤）
        if (window.innerWidth > 640) {
            document.getElementById('searchInput').focus();
        }
    </script>
</body>
</html>
